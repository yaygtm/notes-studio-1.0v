<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF6E2" id="metaTheme">
<meta name="description" content="Notes Studio 1.0 — fast, offline-first notes with Markdown, LaTeX math, diagrams and book-style columns.">
<meta name="color-scheme" content="light dark">
<title>Notes Studio 1.0</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Notes Studio">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<!-- Libraries: pinned + deferred so first paint is never blocked -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"></script>

<style>
/* =====================================================================
   NOTES STUDIO 1.0 — design tokens
   ===================================================================== */
:root{
  --header-h:56px;
  --radius:18px;
  --radius-sm:12px;
  --radius-xs:9px;

  --bg:#FBF6E2;
  --surface:#FFFFFF;
  --surface-2:#F4EEDB;
  --text:#0B2E36;
  --muted:#5E7378;
  --border:rgba(11,46,54,.11);
  --border-strong:rgba(11,46,54,.22);

  --accent:#2563EB;
  --accent-2:#7C3AED;
  --accent-soft:rgba(37,99,235,.10);
  --grad:linear-gradient(135deg,#2563EB 0%,#7C3AED 100%);

  --success:#0E9F6E;
  --warning:#D97706;
  --danger:#DC2626;

  --shadow-1:0 4px 14px rgba(15,23,42,.06);
  --shadow-2:0 14px 34px rgba(15,23,42,.13);
  --shadow-fab:0 12px 26px rgba(37,99,235,.34);

  --code-bg:#F4F1E6;
  --mark-bg:#FDE68A;
  --mark-fg:#3B2F0B;

  --reader-fs:17px;
  --editor-fs:16px;
  --split:50%;

  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#0B1220;
  --surface:#111C2E;
  --surface-2:#17243A;
  --text:#E7EEF7;
  --muted:#94A6BA;
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.18);
  --accent:#5B8CFF;
  --accent-2:#A78BFA;
  --accent-soft:rgba(91,140,255,.14);
  --code-bg:#0C1626;
  --mark-bg:rgba(250,204,21,.30);
  --mark-fg:#FFF8DC;
  --shadow-1:0 4px 16px rgba(0,0,0,.28);
  --shadow-2:0 18px 40px rgba(0,0,0,.45);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Noto Sans",system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,textarea{user-select:text}
img{max-width:100%}
a{color:var(--accent)}
::selection{background:rgba(37,99,235,.22)}
[hidden]{display:none!important}

/* scrollbars */
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-track{background:transparent}

.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ===================== HOME ===================== */
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  padding-top:env(safe-area-inset-top);
  background:var(--bg);
  background:color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.topbar-in{
  max-width:1040px;margin:0 auto;height:var(--header-h);
  display:flex;align-items:center;gap:8px;padding:0 12px;
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand-logo{
  width:34px;height:34px;border-radius:11px;flex:0 0 auto;
  background:var(--grad);display:grid;place-items:center;color:#fff;
  box-shadow:0 6px 14px rgba(37,99,235,.30);
}
.brand-logo svg{width:19px;height:19px;fill:currentColor}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.brand-name{font-weight:800;font-size:1.02rem;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand-ver{font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);opacity:.85}

.icon-btn{
  width:42px;height:42px;flex:0 0 auto;border-radius:13px;
  display:grid;place-items:center;color:var(--text);
  background:var(--surface);border:1px solid var(--border);
  box-shadow:var(--shadow-1);
  transition:transform .12s ease, background .15s;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.icon-btn.ghost{background:transparent;border-color:transparent;box-shadow:none}
.icon-btn.ghost:active{background:var(--accent-soft)}

.home{
  flex:1;width:100%;max-width:1040px;margin:0 auto;
  padding:14px 12px calc(104px + env(safe-area-inset-bottom));
}
.searchbar{position:relative;margin-bottom:10px}
.searchbar svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;fill:var(--muted);pointer-events:none}
.searchbar input{
  width:100%;height:49px;border-radius:15px;
  border:1px solid var(--border);background:var(--surface);
  padding:0 44px 0 44px;font-size:16px;
  box-shadow:var(--shadow-1);outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.searchbar input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search-clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);
}
.search-clear svg{position:static;transform:none;width:16px;height:16px;fill:currentColor}

.chip-row{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-ms-overflow-style:none}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 13px;border-radius:999px;font-size:.78rem;font-weight:600;
  background:var(--surface);border:1px solid var(--border);color:var(--muted);
  white-space:nowrap;transition:all .15s;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.25)}
.chip .cnt{opacity:.65;font-weight:500;margin-left:3px}

.resume{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  background:var(--accent-soft);border:1px solid rgba(37,99,235,.25);
  border-radius:15px;padding:12px 13px;margin-bottom:12px;
}
.resume-txt{flex:1;min-width:170px}
.resume-txt b{font-size:.9rem}
.resume-sub{font-size:.76rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.resume-actions{display:flex;gap:7px}
.mini-btn{
  padding:7px 12px;border-radius:10px;font-size:.78rem;font-weight:700;
  background:var(--surface);border:1px solid var(--border);color:var(--text);
}
.mini-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.mini-btn.danger{background:transparent;border-color:rgba(220,38,38,.35);color:var(--danger)}

.notes-grid{display:grid;grid-template-columns:1fr;gap:11px}
@media(min-width:620px){.notes-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:900px){.notes-grid{grid-template-columns:repeat(3,1fr)}}

.note-card{
  position:relative;display:flex;flex-direction:column;gap:7px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 13px 11px;
  box-shadow:var(--shadow-1);cursor:pointer;
  transition:transform .12s ease, box-shadow .18s ease, border-color .18s;
  overflow:hidden;
}
.note-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--grad);opacity:0;transition:opacity .18s;
}
.note-card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-2)}
.note-card:hover::before{opacity:.85}
.note-card:active{transform:scale(.988)}
.note-card.pinned::before{opacity:1}
.card-top{display:flex;align-items:flex-start;gap:6px}
.note-title{
  flex:1;min-width:0;margin:0;font-size:.98rem;font-weight:750;line-height:1.35;letter-spacing:-.01em;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.pin-btn{
  width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  color:var(--muted);opacity:.5;
}
.pin-btn svg{width:16px;height:16px;fill:currentColor}
.pin-btn.on{color:var(--accent);opacity:1;background:var(--accent-soft)}
.pin-btn:hover{opacity:1;background:var(--accent-soft)}
.note-snippet{
  margin:0;font-size:.855rem;color:var(--muted);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.note-foot{display:flex;align-items:center;gap:8px;margin-top:2px}
.note-meta{font-size:.72rem;color:var(--muted);opacity:.9;display:flex;align-items:center;gap:5px;min-width:0}
.note-meta .dot{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6;flex:0 0 auto}
.more-btn{
  margin-left:auto;width:32px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted);
}
.more-btn svg{width:18px;height:18px;fill:currentColor}
.more-btn:hover{background:var(--surface-2);color:var(--text)}

.empty{
  text-align:center;padding:38px 18px 20px;color:var(--muted);
}
.empty-art{
  width:112px;height:112px;margin:0 auto 14px;border-radius:30px;
  background:linear-gradient(140deg,var(--accent-soft),transparent);
  display:grid;place-items:center;
}
.empty-art svg{width:56px;height:56px;fill:var(--accent);opacity:.85}
.empty h2{margin:0 0 6px;font-size:1.1rem;color:var(--text)}
.empty p{margin:0 0 18px;font-size:.88rem;max-width:320px;margin-inline:auto}
.empty-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:13px;font-weight:700;font-size:.9rem;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  transition:transform .12s, background .15s;
}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn-primary{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.3)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.btn-danger{background:var(--danger);border-color:transparent;color:#fff}
.btn-block{width:100%}

.fab{
  position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:40;
  width:58px;height:58px;border-radius:20px;display:grid;place-items:center;
  background:var(--grad);color:#fff;box-shadow:var(--shadow-fab);
  transition:transform .14s ease;
}
.fab svg{width:26px;height:26px;fill:currentColor}
.fab:active{transform:scale(.92)}

/* ===================== EDITOR SCREEN ===================== */
.screen{
  position:fixed;inset:0;z-index:60;
  display:none;flex-direction:column;
  background:var(--bg);
  padding-top:env(safe-area-inset-top);
  height:100vh;height:100dvh;
}
.screen.open{display:flex;animation:slideUp .22s cubic-bezier(.22,1,.36,1)}
@keyframes slideUp{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}

.screen-head{
  display:flex;align-items:center;gap:6px;
  padding:6px 8px;border-bottom:1px solid var(--border);
  background:var(--bg);
}
.head-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.title-input{
  width:100%;border:0;outline:none;background:transparent;
  font-size:16px;font-weight:750;letter-spacing:-.01em;color:var(--text);
  padding:2px 2px;border-radius:8px;text-overflow:ellipsis;
}
.title-input::placeholder{color:var(--muted);opacity:.75;font-weight:600}
.title-input:focus{background:var(--surface)}
.save-state{font-size:.68rem;color:var(--muted);padding:0 2px;display:flex;align-items:center;gap:4px;min-height:14px}
.save-state .bullet{width:5px;height:5px;border-radius:50%;background:var(--success)}
.save-state.saving .bullet{background:var(--warning);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.save-btn{
  flex:0 0 auto;padding:9px 14px;border-radius:12px;font-size:.82rem;font-weight:750;
  background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.28);
}
.save-btn:active{transform:scale(.96)}

.mode-bar{
  display:flex;align-items:center;gap:8px;padding:7px 10px;
  border-bottom:1px solid var(--border);background:var(--bg);
}
.segmented{
  display:flex;background:var(--surface-2);border-radius:11px;padding:3px;gap:2px;
}
.segmented button{
  padding:6px 11px;border-radius:8px;font-size:.76rem;font-weight:700;color:var(--muted);
  transition:all .15s;
}
.segmented button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-1)}
.read-tools{display:none;align-items:center;gap:6px;margin-left:auto}
.mode-read .read-tools,.mode-split .read-tools{display:flex}
@media(max-width:760px){.mode-split .read-tools .col-seg{display:none}}
.col-seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:1px}
.col-seg button{
  width:26px;height:26px;border-radius:8px;font-size:.72rem;font-weight:750;color:var(--muted);
  display:grid;place-items:center;
}
.col-seg button.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow-1)}
.fs-btn{
  width:28px;height:30px;border-radius:9px;background:var(--surface-2);
  display:grid;place-items:center;font-size:.72rem;font-weight:750;color:var(--muted);
}
.fs-btn:active{background:var(--accent-soft);color:var(--accent)}

.toolbar{
  display:flex;align-items:center;gap:4px;padding:6px 8px;
  overflow-x:auto;scrollbar-width:none;background:var(--bg);
  border-bottom:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
}
.toolbar::-webkit-scrollbar{display:none}
.tb{
  flex:0 0 auto;min-width:36px;height:34px;padding:0 7px;border-radius:9px;
  display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted);
  background:transparent;border:1px solid transparent;transition:all .12s;
}
.tb:active{background:var(--accent-soft);color:var(--accent)}
.tb b,.tb i{font-size:.9rem}
.tb .hl{background:var(--mark-bg);color:var(--mark-fg);border-radius:4px;padding:0 3px;font-size:.75rem}
.tb-sep{flex:0 0 auto;width:1px;height:20px;background:var(--border);margin:0 3px}
.mode-read .toolbar{display:none}

.panes{flex:1;display:flex;min-height:0;overflow:hidden}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pane-editor{flex:1 1 auto}
.pane-preview{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--bg)}
#editor{
  flex:1;width:100%;border:0;outline:none;resize:none;
  background:transparent;color:var(--text);
  padding:14px 14px 120px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  font-size:var(--editor-fs);line-height:1.65;
  tab-size:2;-moz-tab-size:2;
  caret-color:var(--accent);
}
#editor::placeholder{color:var(--muted);opacity:.7}

.resizer{flex:0 0 0;position:relative;background:var(--border);touch-action:none;display:none}
.resizer::after{
  content:"";position:absolute;inset:0;margin:auto;width:34px;height:4px;border-radius:4px;
  background:var(--border-strong);opacity:.8;
}
.mode-split .resizer{display:block;flex-basis:9px;cursor:col-resize}
.mode-split .pane-editor{flex:0 0 var(--split)}
.mode-split .pane-preview{flex:1 1 auto}
.mode-split .reader-inner{column-count:1!important;text-align:left!important;max-width:100%!important;column-rule:0!important}
@media(max-width:560px){.reader-inner.cols-2,.reader-inner.cols-3,.reader-inner.cols-4{column-count:1;column-rule:0;text-align:left}}
@media(min-width:561px) and (max-width:820px){.reader-inner.cols-4{column-count:2}.reader-inner.cols-3{column-count:2}}
.mode-edit .pane-preview{display:none}
.mode-read .pane-editor{display:none}

@media(max-width:760px){
  .mode-split .panes{flex-direction:column}
  .mode-split .pane-editor{flex:0 0 var(--split)}
  .mode-split .pane-preview{flex:1 1 auto;min-height:0}
  .mode-split .resizer{flex-basis:10px;cursor:row-resize}
  .mode-split .resizer::after{width:44px;height:4px}
}

#statRender{color:var(--warning);font-weight:700;display:inline-flex;align-items:center;gap:4px}
#statRender::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1s infinite}
.statusbar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 12px calc(6px + env(safe-area-inset-bottom));
  border-top:1px solid var(--border);background:var(--bg);
  font-size:.68rem;color:var(--muted);
  font-variant-numeric:tabular-nums;
  min-height:30px;
}
.mode-read .statusbar{display:none}

/* ===================== READER TYPOGRAPHY ===================== */
.reader-inner{
  max-width:860px;margin:0 auto;
  padding:16px 14px 90px;
  font-size:var(--reader-fs);line-height:1.72;
  color:var(--text);
  overflow-wrap:break-word;
  word-break:break-word;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Devanagari","Nirmala UI",Mangal,"Kohinoor Devanagari",system-ui,sans-serif;
}
.reader-inner[data-font="serif"]{font-family:Georgia,"Iowan Old Style","Noto Serif Devanagari","Times New Roman",serif}
.reader-inner[data-font="mono"]{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:calc(var(--reader-fs) - 1px)}

.reader-inner.cols-2,.reader-inner.cols-3,.reader-inner.cols-4{max-width:1180px}
.reader-inner.cols-2{column-count:2;column-gap:26px;column-rule:1px solid var(--border)}
.reader-inner.cols-3{column-count:3;column-gap:22px;column-rule:1px solid var(--border);font-size:calc(var(--reader-fs) * .94);line-height:1.62}
.reader-inner.cols-4{column-count:4;column-gap:18px;column-rule:1px solid var(--border);font-size:calc(var(--reader-fs) * .88);line-height:1.58}
.reader-inner.cols-2,.reader-inner.cols-3,.reader-inner.cols-4{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.reader-inner.cols-2 h1,.reader-inner.cols-3 h1,.reader-inner.cols-4 h1{font-size:1.5em}

.reader-inner>*:first-child{margin-top:0}
.reader-inner h1,.reader-inner h2,.reader-inner h3,.reader-inner h4,.reader-inner h5,.reader-inner h6{
  line-height:1.28;letter-spacing:-.015em;font-weight:750;margin:1.25em 0 .5em;
  break-after:avoid;page-break-after:avoid;
}
.reader-inner h1{font-size:1.75em;padding-bottom:.22em;border-bottom:2px solid var(--border-strong);margin-top:.6em}
.reader-inner h2{font-size:1.34em;color:var(--accent)}
.reader-inner h3{font-size:1.14em}
.reader-inner h4{font-size:1.02em}
.reader-inner h5,.reader-inner h6{font-size:.95em;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.reader-inner p{margin:.62em 0}
.reader-inner strong{font-weight:750}
.reader-inner em{font-style:italic}
.reader-inner del{opacity:.65}
.reader-inner mark{background:var(--mark-bg);color:var(--mark-fg);border-radius:4px;padding:0 3px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.reader-inner a{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
.reader-inner hr{border:0;border-top:1px solid var(--border-strong);margin:1.4em 0}
.reader-inner ul,.reader-inner ol{margin:.55em 0;padding-left:1.35em}
.reader-inner li{margin:.22em 0}
.reader-inner li>ul,.reader-inner li>ol{margin:.2em 0}
.reader-inner blockquote{
  margin:.9em 0;padding:.15em 0 .15em 14px;
  border-left:3px solid var(--accent);
  color:var(--muted);font-style:italic;
}
.reader-inner blockquote p{margin:.35em 0}

.reader-inner pre{
  background:var(--code-bg);border:1px solid var(--border);border-radius:12px;
  padding:12px 13px;overflow:auto;margin:.85em 0;
  font-size:.82em;line-height:1.55;
}
.reader-inner pre code{background:none;border:0;padding:0;font-size:1em}
.reader-inner code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.88em}
.reader-inner :not(pre)>code{
  background:var(--code-bg);border:1px solid var(--border);
  padding:.1em .36em;border-radius:6px;white-space:break-spaces;
}
.code-block{margin:.9em 0;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.code-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 10px;border-bottom:1px solid var(--border);
  font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);
}
.code-copy{font-size:.68rem;font-weight:700;color:var(--accent);padding:3px 8px;border-radius:6px;background:var(--accent-soft)}
.code-block pre{margin:0;border:0;border-radius:0;background:transparent}

.table-wrap{overflow-x:auto;margin:.9em 0;border:1px solid var(--border);border-radius:12px;-webkit-overflow-scrolling:touch}
.reader-inner table{border-collapse:collapse;width:100%;font-size:.9em;min-width:100%}
.reader-inner th,.reader-inner td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
.reader-inner thead th{background:var(--surface-2);font-weight:750;font-size:.94em;white-space:nowrap}
.reader-inner tbody tr:last-child td{border-bottom:0}

.reader-inner img{border-radius:12px;display:block;margin:.9em auto;height:auto}

.task-list{list-style:none;padding-left:.2em!important}
.task-list li{display:flex;gap:8px;align-items:flex-start;margin:.3em 0}
.task-list input[type=checkbox]{
  flex:0 0 auto;width:16px;height:16px;margin-top:.34em;accent-color:var(--accent);
}
.task-list li.done>span{text-decoration:line-through;opacity:.62}

/* callouts */
.callout{
  border:1px solid;border-left-width:4px;border-radius:12px;
  padding:9px 12px;margin:.9em 0;
  break-inside:avoid;page-break-inside:avoid;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.callout-title{display:flex;align-items:center;gap:6px;font-weight:750;font-size:.92em;margin-bottom:3px}
.callout-body>:first-child{margin-top:0}
.callout-body>:last-child{margin-bottom:0}
.callout-body p{margin:.3em 0}
.callout.note{background:#EFF6FF;border-color:#BFDBFE;border-left-color:#3B82F6;color:#173A66}
.callout.tip{background:#ECFDF5;border-color:#A7F3D0;border-left-color:#10B981;color:#065F46}
.callout.important{background:#F5F3FF;border-color:#DDD6FE;border-left-color:#8B5CF6;color:#4C1D95}
.callout.warning{background:#FFFBEB;border-color:#FDE68A;border-left-color:#F59E0B;color:#7C4A03}
.callout.caution{background:#FEF2F2;border-color:#FECACA;border-left-color:#EF4444;color:#8C1D1D}
.callout.success{background:#F0FDF4;border-color:#BBF7D0;border-left-color:#22C55E;color:#14532D}
.callout.question{background:#F5F3FF;border-color:#DDD6FE;border-left-color:#7C3AED;color:#4C1D95}
.callout.example{background:#F8FAFC;border-color:#E2E8F0;border-left-color:#64748B;color:#334155}
html[data-theme="dark"] .callout{color:#EAF1FA;border-color:rgba(255,255,255,.16)}
html[data-theme="dark"] .callout.note{background:rgba(59,130,246,.15);border-left-color:#60A5FA}
html[data-theme="dark"] .callout.tip{background:rgba(16,185,129,.15);border-left-color:#34D399}
html[data-theme="dark"] .callout.important,
html[data-theme="dark"] .callout.question{background:rgba(139,92,246,.15);border-left-color:#A78BFA}
html[data-theme="dark"] .callout.warning{background:rgba(245,158,11,.15);border-left-color:#FBBF24}
html[data-theme="dark"] .callout.caution{background:rgba(239,68,68,.15);border-left-color:#F87171}
html[data-theme="dark"] .callout.success{background:rgba(34,197,94,.15);border-left-color:#4ADE80}
html[data-theme="dark"] .callout.example{background:rgba(148,163,184,.12);border-left-color:#94A3B8}

/* math */
.katex .mord.text,.katex .mord.textord,.katex .mathrm,.katex .textrm,.katex .text{
  font-family:KaTeX_Main,"Noto Sans Devanagari","Noto Serif Devanagari","Nirmala UI",Mangal,"Kohinoor Devanagari",sans-serif;
}
.math-block{
  overflow-x:auto;overflow-y:hidden;margin:.85em 0;padding:2px 0;
  text-align:center;break-inside:avoid;page-break-inside:avoid;
}
.math-block .katex-display{margin:.25em 0}
.reader-inner .katex{font-size:1.05em}
.reader-inner .katex-display>.katex{white-space:normal}
.math-error{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA;border-radius:8px;padding:2px 6px;font-family:monospace;font-size:.85em}
html[data-theme="dark"] .math-error{background:rgba(239,68,68,.14);color:#FCA5A5;border-color:rgba(239,68,68,.4)}

/* offline lite math */
.lite-math{font-family:"Cambria Math","STIX Two Math",Georgia,"Noto Serif Devanagari",serif;font-style:normal}
.math-block .lite-math{font-size:1.12em;display:inline-block}
.lite-frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.15}
.lite-frac>.num{border-bottom:1px solid currentColor;padding:0 .25em}
.lite-frac>.den{padding:0 .25em}
.lite-sqrt>.radicand{border-top:1px solid currentColor;padding:0 .1em}
.lite-math sup,.lite-math sub{font-size:.72em}

/* diagrams */
.diagram{margin:1em 0;text-align:center;break-inside:avoid;page-break-inside:avoid}
.diagram svg{max-width:100%;height:auto;display:block;margin:0 auto}
.diagram-inner{background:#fff;border-radius:12px;padding:10px;display:inline-block;max-width:100%;overflow:auto}
html[data-theme="dark"] .diagram-inner{background:#fff}
.diagram-src{margin:.5em 0 0;font-size:.72em;text-align:left}
.diagram-err{
  background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;border-radius:10px;
  padding:10px 12px;font-size:.78em;text-align:left;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,monospace;
}
html[data-theme="dark"] .diagram-err{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35);color:#FCA5A5}

.svg-block{margin:1em auto;text-align:center;max-width:100%;overflow:auto}
.svg-block svg{max-width:100%;height:auto;display:inline-block}

/* ===================== SHEETS ===================== */
.sheet-backdrop{
  position:fixed;inset:0;z-index:80;background:rgba(4,10,20,.48);
  opacity:0;pointer-events:none;transition:opacity .2s;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet-wrap{
  position:fixed;inset:0;z-index:85;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;visibility:hidden;
  transition:visibility 0s linear .3s;
}
.sheet-wrap.open{visibility:visible;transition-delay:0s}
.sheet{
  pointer-events:auto;width:100%;max-height:88vh;max-height:88dvh;
  background:var(--surface);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(0,0,0,.25);
  display:flex;flex-direction:column;
  transform:translateY(104%);transition:transform .26s cubic-bezier(.22,1,.36,1);
  padding-bottom:env(safe-area-inset-bottom);
  border-top:1px solid var(--border);
}
.sheet-wrap.open .sheet{transform:none}
@media(min-width:760px){
  .sheet-wrap{align-items:center}
  .sheet{max-width:600px;border-radius:22px;max-height:82vh;padding-bottom:0;border:1px solid var(--border)}
  .sheet-wrap.open .sheet{transform:none}
}
.sheet-grab{width:38px;height:4px;border-radius:4px;background:var(--border-strong);margin:8px auto 2px;flex:0 0 auto}
@media(min-width:760px){.sheet-grab{display:none}}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px 8px;flex:0 0 auto}
.sheet-title{margin:0;font-size:1rem;font-weight:750;flex:1;min-width:0}
.sheet-close{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2)}
.sheet-close svg{width:16px;height:16px;fill:currentColor}
.sheet-body{overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-body:empty{display:none}

.sheet-section{margin:14px 0 6px;font-size:.68rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.sheet-list{display:flex;flex-direction:column;gap:2px}
.sheet-item{
  display:flex;align-items:center;gap:12px;width:100%;
  padding:12px 10px;border-radius:12px;font-size:.9rem;font-weight:600;color:var(--text);
  transition:background .12s;
}
.sheet-item:active,.sheet-item:hover{background:var(--surface-2)}
.sheet-item svg{width:20px;height:20px;fill:var(--muted);flex:0 0 auto}
.sheet-item .it-main{flex:1;min-width:0;display:flex;flex-direction:column}
.sheet-item .it-sub{font-size:.72rem;font-weight:500;color:var(--muted);margin-top:1px}
.sheet-item.danger{color:var(--danger)}
.sheet-item.danger svg{fill:var(--danger)}

/* settings rows */
.set-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border)}
.set-row:last-child{border-bottom:0}
.set-main{flex:1;min-width:0}
.set-label{font-size:.86rem;font-weight:650}
.set-sub{font-size:.72rem;color:var(--muted);margin-top:1px}
.set-row select,.set-row input[type=number]{
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  border-radius:10px;padding:8px 10px;font-size:.8rem;font-weight:600;outline:none;
  max-width:150px;
}
.set-row select:focus{border-color:var(--accent)}
.switch{position:relative;display:inline-flex;flex:0 0 auto;width:46px;height:27px}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.switch .track{
  position:absolute;inset:0;border-radius:999px;background:var(--border-strong);transition:background .18s;
}
.switch .thumb{
  position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .18s;
}
.switch input:checked~.track{background:var(--accent)}
.switch input:checked~.thumb{transform:translateX(19px)}
.chip-select{display:flex;gap:6px;flex-wrap:wrap}
.chip-select button{
  padding:7px 12px;border-radius:999px;font-size:.76rem;font-weight:650;
  background:var(--surface-2);color:var(--muted);border:1px solid transparent;
}
.chip-select button.on{background:var(--accent);color:#fff}

/* sheet note / confirm */
.sheet-note{font-size:.85rem;color:var(--muted);line-height:1.55;margin:8px 0 16px}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
.sheet-actions .btn{flex:1;min-width:120px}
.prompt-input{
  width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:16px;outline:none;margin:8px 0 14px;
}
.prompt-input:focus{border-color:var(--accent)}

/* recycle rows */
.rec-row{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--border)}
.rec-main{flex:1;min-width:0}
.rec-title{font-size:.88rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-sub{font-size:.7rem;color:var(--muted)}
.rec-actions{display:flex;gap:4px;flex:0 0 auto}
.icon-mini{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.icon-mini svg{width:16px;height:16px;fill:currentColor}
.icon-mini.danger{color:var(--danger);background:rgba(220,38,38,.08)}

/* print option grid */
.opt-group{margin:6px 0 14px}
.opt-group>label{display:block;font-size:.72rem;font-weight:750;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px}
.opt-row{display:flex;gap:6px;flex-wrap:wrap}
.opt-pill{
  padding:9px 13px;border-radius:11px;font-size:.8rem;font-weight:650;
  background:var(--surface-2);color:var(--muted);border:1px solid transparent;
}
.opt-pill.on{background:var(--accent-soft);color:var(--accent);border-color:rgba(37,99,235,.35)}

/* toast */
.toast-wrap{
  position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));
  z-index:110;display:flex;flex-direction:column;align-items:center;gap:8px;
  pointer-events:none;padding:0 12px;
}
.toast{
  pointer-events:auto;max-width:min(460px,94vw);
  background:#0B1220;color:#F3F7FC;
  border:1px solid rgba(255,255,255,.14);
  padding:10px 14px;border-radius:14px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
  display:flex;align-items:center;gap:12px;
  font-size:.84rem;line-height:1.4;
  animation:toastIn .22s ease;
}
.toast.out{animation:toastOut .2s ease forwards}
.toast button{color:#93C5FD;font-weight:750;font-size:.82rem;white-space:nowrap;flex:0 0 auto}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}

/* ===================== PRINT ===================== */
#printArea{display:none}
#printDyn:empty{display:none}

@media print{
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  .app,.screen,.sheet-wrap,.sheet-backdrop,.toast-wrap,.fab,.topbar{display:none!important}
  #printArea{display:block!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Serif Devanagari",Georgia,serif;color:#000}
  #printArea a{color:#000;text-decoration:underline}
  #printArea img{max-width:100%;height:auto;border-radius:0}
  #printArea .print-title{
    font-size:1.5em;font-weight:750;margin:0 0 .5em;padding-bottom:.2em;
    border-bottom:2px solid #444;line-height:1.25;
  }
  #printArea .print-cols{text-align:justify;hyphens:auto}
  #printArea .print-cols>h1:first-child{display:none}
  #printArea h1,#printArea h2,#printArea h3,#printArea h4,#printArea h5,#printArea h6{
    break-after:avoid;page-break-after:avoid;line-height:1.25;
  }
  #printArea p{orphans:2;widows:2;margin:.5em 0}
  #printArea img,#printArea pre,#printArea table,#printArea .callout,#printArea .math-block,#printArea .diagram{
    break-inside:avoid;page-break-inside:avoid;
  }
  #printArea .code-block{break-inside:avoid;border:1px solid #ccc;background:#f7f7f7}
  #printArea .code-head{border-bottom:1px solid #ddd;background:#efefef}
  #printArea .code-copy{display:none}
  #printArea pre{background:#f7f7f7;border:1px solid #ddd;border-radius:6px;padding:8px;font-size:.82em}
  #printArea .table-wrap{border:1px solid #999;border-radius:0;overflow:visible}
  #printArea table{font-size:.84em}
  #printArea th,#printArea td{border-bottom:1px solid #bbb;padding:5px 6px}
  #printArea td{overflow-wrap:anywhere}
  #printArea th{overflow-wrap:normal;hyphens:auto}
  #printArea thead th{background:#eee!important;white-space:normal}
  #printArea .diagram,#printArea .svg-block{max-width:100%}
  #printArea .diagram svg,#printArea .svg-block svg,#printArea img{max-width:100%;height:auto}
  #printArea .callout{color:#111!important}
  #printArea .katex{font-size:1em}
  #printArea .diagram-inner{background:#fff}
  #printArea .lite-math{font-family:Georgia,serif}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>

<script type="module">
/* =====================================================================
   NOTES STUDIO 1.0
   Single-file, offline-first notes with Markdown + LaTeX + diagrams.
   Vanilla JS. No build step. No backend.
   ===================================================================== */
(function () {
'use strict';

/* ------------------------------ helpers ------------------------------ */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const on = (el, ev, fn, opts) => el && el.addEventListener(ev, fn, opts);
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const escapeHtml = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ESC_MAP[c]);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const debounce = (fn, ms) => { let t; return function (...a) { clearTimeout(t); t = setTimeout(() => fn.apply(this, a), ms); }; };

let _seq = 0;
const uid = () => Date.now() * 100 + (_seq = (_seq + 1) % 100);

/* Storage may be blocked (sandboxed preview, private mode, opaque origin). */
const LS_OK = (function () {
  try {
    const t = '__ns_test__';
    localStorage.setItem(t, '1');
    localStorage.removeItem(t);
    return true;
  } catch (e) { return false; }
})();
let storageWarned = false;

const LS = {
  get(k, fb) { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch (e) { return fb; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  raw(k, fb) { try { const v = localStorage.getItem(k); return v == null ? fb : v; } catch (e) { return fb; } },
  rawSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

const K = {
  notes: 'ns.notes.v1',
  recycle: 'ns.recycle.v1',
  settings: 'ns.settings.v1',
  draft: 'ns.draft.v1',
  lastOpen: 'ns.lastopen.v1'
};

const DEFAULT_SETTINGS = {
  theme: 'system',
  mode: 'edit',
  cols: 1,
  fontSize: 17,
  readerFont: 'sans',
  autosave: true,
  autoPreview: true,
  mathEngine: 'auto',       // auto | katex | lite
  mermaid: true,
  split: 50,
  printCols: 1,
  printPaper: 'a3',
  printMargin: 0.5,
  printSize: 11,
  printTitle: true,
  sort: 'updated',
  bareLatex: true
};

/* ------------------------------ state ------------------------------ */
const S = {
  notes: {},
  recycle: [],
  settings: Object.assign({}, DEFAULT_SETTINGS),
  view: 'home',
  currentId: null,
  content: '',
  title: '',
  dirty: false,
  query: '',
  activeTag: 'all',
  mode: 'edit',
  cols: 1,
  fontSize: 17,
  split: 50,
  katexOk: false,
  markedOk: false,
  mermaidOk: false,
  printedOnce: false,
  renderTimer: 0,
  draftTimer: 0,
  saveTimer: 0,
  mathCount: 0,
  sheetOpen: false,
  lastFocus: null
};

/* ------------------------------ toast ------------------------------ */
function toast(msg, opts) {
  const wrap = $('#toastWrap');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast';
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  let timer;
  const close = () => {
    clearTimeout(timer);
    el.classList.add('out');
    setTimeout(() => el.remove(), 220);
  };
  const o = opts || {};
  if (o.action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = o.action.label;
    b.addEventListener('click', () => { close(); try { o.action.fn(); } catch (e) {} });
    el.appendChild(b);
  }
  wrap.appendChild(el);
  while (wrap.children.length > 3) wrap.firstElementChild.remove();
  timer = setTimeout(close, o.duration || 2800);
}

/* ------------------------------ settings & theme ------------------------------ */
function saveSettings() { LS.set(K.settings, S.settings); }

function effectiveTheme() {
  const t = S.settings.theme;
  if (t === 'dark' || t === 'light') return t;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function applyTheme() {
  const t = effectiveTheme();
  const html = document.documentElement;
  html.setAttribute('data-theme', t);
  const icon = $('#btnTheme use');
  if (icon) icon.setAttribute('href', t === 'dark' ? '#i-sun' : '#i-moon');
  const meta = $('#metaTheme');
  if (meta) meta.setAttribute('content', t === 'dark' ? '#0B1220' : '#FBF6E2');
  const btn = $('#btnTheme');
  if (btn) btn.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
}

function toggleTheme() {
  S.settings.theme = effectiveTheme() === 'dark' ? 'light' : 'dark';
  saveSettings();
  applyTheme();
  if (S.view === 'editor') scheduleRender(0);
}

/* ------------------------------ storage load ------------------------------ */
function sanitizeNote(raw, fallbackId) {
  if (!raw || typeof raw !== 'object') return null;
  const id = Number(raw.id) || fallbackId || uid();
  const content = typeof raw.content === 'string' ? raw.content : '';
  const title = typeof raw.title === 'string' && raw.title.trim() ? raw.title.trim() : deriveTitle(content, true);
  const created = Number(raw.createdAt) || Number(raw.id) || Date.now();
  const updated = Number(raw.updatedAt) || created;
  return {
    id: id,
    title: title,
    content: content,
    createdAt: created,
    updatedAt: updated,
    pinned: !!raw.pinned,
    tags: Array.isArray(raw.tags) ? raw.tags.filter((x) => typeof x === 'string').slice(0, 12) : deriveTags(content)
  };
}

function loadStore() {
  const rawNotes = LS.get(K.notes, null);
  const rawRecycle = LS.get(K.recycle, null);
  const rawSettings = LS.get(K.settings, null);

  S.settings = Object.assign({}, DEFAULT_SETTINGS, (rawSettings && typeof rawSettings === 'object') ? rawSettings : {});

  const notes = {};
  if (rawNotes && typeof rawNotes === 'object') {
    Object.keys(rawNotes).forEach((k) => {
      const n = sanitizeNote(rawNotes[k], Number(k) || undefined);
      if (n) notes[n.id] = n;
    });
  }
  S.notes = notes;

  S.recycle = Array.isArray(rawRecycle)
    ? rawRecycle.map((r) => sanitizeNote(r, uid())).filter(Boolean).map((r, i) => {
        const src = rawRecycle[i] || {};
        r.deletedAt = Number(src.deletedAt) || Date.now();
        return r;
      })
    : [];

  migrateLegacy();
}

/** Import data created by ExamCraft AI v9.x if the new store is empty. */
function migrateLegacy() {
  const hadNew = Object.keys(S.notes).length > 0;
  if (hadNew) return;
  const legacy = LS.get('ec_notes', null);
  if (!legacy || typeof legacy !== 'object') return;
  let count = 0;
  Object.keys(legacy).forEach((k) => {
    const n = sanitizeNote(legacy[k], Number(k) || undefined);
    if (n && n.content) { S.notes[n.id] = n; count++; }
  });
  if (!count) return;
  persistNotes();
  const legacyBin = LS.get('ec_recycle', null);
  if (Array.isArray(legacyBin) && legacyBin.length && !S.recycle.length) {
    S.recycle = legacyBin.map((r) => {
      const n = sanitizeNote(r, uid());
      if (n) n.deletedAt = Number(r.deletedAt) || Date.now();
      return n;
    }).filter(Boolean);
    persistRecycle();
  }
  setTimeout(() => toast(count + ' note' + (count > 1 ? 's' : '') + ' imported from ExamCraft AI', { duration: 4200 }), 700);
}

function persistNotes() {
  if (!LS.set(K.notes, S.notes)) {
    if (!LS_OK) {
      if (!storageWarned) {
        storageWarned = true;
        toast('This preview cannot save — open the downloaded file to store notes.', { duration: 6000 });
      }
    } else {
      toast('Storage full — export a backup, then delete old notes.', { duration: 6000 });
    }
    return false;
  }
  return true;
}
function persistRecycle() {
  return LS.set(K.recycle, S.recycle);
}

/* ------------------------------ note helpers ------------------------------ */
function deriveTitle(content, plain) {
  const lines = String(content || '').split('\n');
  for (let i = 0; i < lines.length; i++) {
    let line = lines[i].trim();
    if (!line) continue;
    if (/^```/.test(line)) continue;
    if (/^[-*_]{3,}$/.test(line)) continue;
    line = line.replace(/^#{1,6}\s+/, '')
               .replace(/^>\s*/, '')
               .replace(/^\[\!?\w+\]\s*/, '')
               .replace(/^[-*+]\s+(\[[ xX]\]\s+)?/, '')
               .replace(/^\d+[.)]\s+/, '')
               .replace(/[*_~`$]+/g, '')
               .replace(/\\[()[\]]/g, '')
               .trim();
    if (line) return line.slice(0, 80);
  }
  return plain ? 'Untitled note' : '';
}

function deriveTags(content) {
  const out = new Set();
  const re = /(^|[\s(])#([\p{L}\p{N}_-]{1,24})/gu;
  let m;
  const text = String(content || '').replace(/```[\s\S]*?```/g, ' ');
  while ((m = re.exec(text)) && out.size < 12) {
    const tag = m[2].toLowerCase();
    if (/^\d+$/.test(tag)) continue;
    out.add(tag);
  }
  return Array.from(out);
}

function snippetOf(content) {
  const txt = String(content || '')
    .replace(/```[\s\S]*?```/g, ' ')
    .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/^\s{0,3}#{1,6}\s+/gm, '')
    .replace(/^>\s?/gm, '')
    .replace(/[*_~`>#]/g, '')
    .replace(/\\[()[\]]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
  return txt;
}

function wordCount(text) {
  const t = String(text || '').trim();
  if (!t) return 0;
  return t.split(/\s+/).filter(Boolean).length;
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) {
    const diff = (now - d) / 1000;
    if (diff < 60) return 'Just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    return 'Today, ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return 'Yesterday';
  const opts = { day: 'numeric', month: 'short' };
  if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString(undefined, opts);
}

function storageBytes() {
  try {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.indexOf('ns.') !== 0) continue;
      const v = localStorage.getItem(k) || '';
      total += k.length + v.length;
    }
    return total * 2; // UTF-16
  } catch (e) { return 0; }
}
function formatBytes(b) {
  if (!b) return '0 KB';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / (1024 * 1024)).toFixed(2) + ' MB';
}

/* ------------------------------ sheet (bottom sheet / dialog) ------------------------------ */
const sheet = {
  open(title, buildBody, opts) {
    const wrap = $('#sheetWrap');
    const body = $('#sheetBody');
    $('#sheetTitle').textContent = title || '';
    body.innerHTML = '';
    wrap.setAttribute('aria-hidden', 'false');
    $('#sheetBackdrop').classList.add('open');
    wrap.classList.add('open');
    S.sheetOpen = true;
    S.lastFocus = document.activeElement;
    if (typeof buildBody === 'function') buildBody(body);
    const focusable = body.querySelector('button, input, select, textarea, a[href]');
    if (focusable) setTimeout(() => { try { focusable.focus({ preventScroll: true }); } catch (e) {} }, 260);
  },
  close(viaHistory) {
    if (!S.sheetOpen) return;
    S.sheetOpen = false;
    $('#sheetWrap').classList.remove('open');
    $('#sheetBackdrop').classList.remove('open');
    $('#sheetWrap').setAttribute('aria-hidden', 'true');
    setTimeout(() => { if (!S.sheetOpen) $('#sheetBody').innerHTML = ''; }, 280);
    if (S.lastFocus && S.lastFocus.focus) { try { S.lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }
};

/* ---------------------------------------------------------------------
   Hardware-back handling.
   One permanent "guard" entry sits on top of the session history. When a
   back press consumes it we close the top-most layer and put the guard back.
   Programmatic closes never touch history, so nothing can drift or escape
   to about:blank.
   --------------------------------------------------------------------- */
const nav = {
  arm() {
    try { history.pushState({ ns: 'guard' }, ''); } catch (e) {}
  },
  init() {
    try {
      history.replaceState({ ns: 'root' }, '');
      nav.arm();
    } catch (e) {}
  }
};

window.addEventListener('popstate', () => {
  if (S.sheetOpen) { sheet.close(true); nav.arm(); return; }
  if (S.view === 'editor') { closeEditorUI(true); nav.arm(); return; }
  // nothing open — let the browser leave the app
});

function confirmDialog(opts) {
  return new Promise((resolve) => {
    sheet.open(opts.title || 'Confirm', (body) => {
      const note = document.createElement('p');
      note.className = 'sheet-note';
      note.textContent = opts.message || '';
      body.appendChild(note);
      const row = document.createElement('div');
      row.className = 'sheet-actions';
      const cancel = document.createElement('button');
      cancel.className = 'btn';
      cancel.type = 'button';
      cancel.textContent = opts.cancelText || 'Cancel';
      const ok = document.createElement('button');
      ok.className = 'btn ' + (opts.danger ? 'btn-danger' : 'btn-primary');
      ok.type = 'button';
      ok.textContent = opts.okText || 'OK';
      row.appendChild(cancel); row.appendChild(ok);
      body.appendChild(row);
      cancel.addEventListener('click', () => { sheet.close(); resolve(false); });
      ok.addEventListener('click', () => { sheet.close(); resolve(true); });
    });
  });
}

function promptDialog(opts) {
  return new Promise((resolve) => {
    sheet.open(opts.title || 'Enter value', (body) => {
      const input = document.createElement('input');
      input.className = 'prompt-input';
      input.type = 'text';
      input.placeholder = opts.placeholder || '';
      input.value = opts.value || '';
      body.appendChild(input);
      const row = document.createElement('div');
      row.className = 'sheet-actions';
      const cancel = document.createElement('button');
      cancel.className = 'btn'; cancel.type = 'button'; cancel.textContent = 'Cancel';
      const ok = document.createElement('button');
      ok.className = 'btn btn-primary'; ok.type = 'button'; ok.textContent = opts.okText || 'Apply';
      row.appendChild(cancel); row.appendChild(ok);
      body.appendChild(row);
      const done = (val) => { sheet.close(); resolve(val); };
      cancel.addEventListener('click', () => done(null));

      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); done(input.value); } });
      setTimeout(() => input.focus(), 260);
    });
  });
}

/* ------------------------------ home rendering ------------------------------ */
function sortedNotes() {
  return Object.values(S.notes).sort((a, b) => {
    if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
    if (S.settings.sort === 'title') return a.title.localeCompare(b.title);
    if (S.settings.sort === 'created') return b.createdAt - a.createdAt;
    return b.updatedAt - a.updatedAt;
  });
}

function filteredNotes() {
  const q = S.query.trim().toLowerCase();
  return sortedNotes().filter((n) => {
    if (S.activeTag !== 'all' && !(n.tags || []).includes(S.activeTag)) return false;
    if (!q) return true;
    if (n.title.toLowerCase().indexOf(q) !== -1) return true;
    return n.content.toLowerCase().indexOf(q) !== -1;
  });
}

function renderHome() {
  const grid = $('#notesGrid');
  const empty = $('#emptyState');
  const all = sortedNotes();
  const list = filteredNotes();

  renderChips(all);
  renderResume();

  const clr = $('#searchClear');
  if (clr) clr.hidden = !S.query;

  if (!all.length) {
    grid.innerHTML = '';
    empty.innerHTML =
      '<div class="empty">' +
      '<div class="empty-art"><svg><use href="#i-file"/></svg></div>' +
      '<h2>Your notes live here</h2>' +
      '<p>Write in Markdown with LaTeX math, diagrams and callouts. Everything is saved on this device — no account needed.</p>' +
      '<div class="empty-actions">' +
      '<button class="btn btn-primary" type="button" data-empty="new"><svg><use href="#i-plus"/></svg>New note</button>' +
      '<button class="btn" type="button" data-empty="template"><svg><use href="#i-template"/></svg>Templates</button>' +
      '</div></div>';
    return;
  }
  empty.innerHTML = '';

  if (!list.length) {
    grid.innerHTML =
      '<div class="empty" style="grid-column:1/-1">' +
      '<div class="empty-art"><svg><use href="#i-search"/></svg></div>' +
      '<h2>No matches</h2><p>Nothing found for “' + escapeHtml(S.query) + '”.</p>' +
      '<div class="empty-actions"><button class="btn" type="button" data-empty="clear">Clear search</button></div></div>';

  }

  const frag = document.createDocumentFragment();

function noteCard(n) {
  const card = document.createElement('article');
  card.className = 'note-card' + (n.pinned ? ' pinned' : '');
  card.setAttribute('role', 'button');
  card.tabIndex = 0;
  card.dataset.id = String(n.id);

  const top = document.createElement('div');
  top.className = 'card-top';

  const title = document.createElement('h3');
  title.className = 'note-title';
  title.textContent = n.title || 'Untitled note';
  top.appendChild(title);

  const pin = document.createElement('button');
  pin.type = 'button';
  pin.className = 'pin-btn' + (n.pinned ? ' on' : '');
  pin.setAttribute('aria-label', n.pinned ? 'Unpin note' : 'Pin note');
  pin.dataset.act = 'pin';
  pin.innerHTML = '<svg><use href="#i-pin"/></svg>';
  top.appendChild(pin);
  card.appendChild(top);

  const snip = snippetOf(n.content);
  if (snip) {
    const p = document.createElement('p');
    p.className = 'note-snippet';
    p.textContent = snip.slice(0, 170);
    card.appendChild(p);
  }

  const foot = document.createElement('div');
  foot.className = 'note-foot';
  const meta = document.createElement('div');
  meta.className = 'note-meta';
  const date = document.createElement('span');
  date.textContent = formatDate(n.updatedAt);
  meta.appendChild(date);
  if (n.tags && n.tags.length) {
    const dot = document.createElement('span'); dot.className = 'dot'; meta.appendChild(dot);
    const tag = document.createElement('span');
    tag.textContent = '#' + n.tags[0] + (n.tags.length > 1 ? ' +' + (n.tags.length - 1) : '');
    meta.appendChild(tag);
  }
  foot.appendChild(meta);

  const more = document.createElement('button');
  more.type = 'button';
  more.className = 'more-btn';
  more.setAttribute('aria-label', 'Note actions');
  more.dataset.act = 'more';
  more.innerHTML = '<svg><use href="#i-more"/></svg>';
  foot.appendChild(more);
  card.appendChild(foot);

  return card;
}

function renderChips(all) {
  const row = $('#filterChips');
  if (!row) return;
  const tagCount = {};
  all.forEach((n) => (n.tags || []).forEach((t) => { tagCount[t] = (tagCount[t] || 0) + 1; }));
  const tags = Object.keys(tagCount).sort((a, b) => tagCount[b] - tagCount[a]).slice(0, 12);

  row.innerHTML = '';
  if (!all.length) return;

  const mk = (id, label, count) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (S.activeTag === id ? ' on' : '');
    b.dataset.tag = id;
    b.textContent = label;
    if (count != null) {
      const c = document.createElement('span');
      c.className = 'cnt';
      c.textContent = count;
      b.appendChild(c);
    }
    row.appendChild(b);
  };
  mk('all', 'All notes', all.length);
  tags.forEach((t) => mk(t, '#' + t, tagCount[t]));
}
