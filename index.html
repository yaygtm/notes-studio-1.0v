/* ------------------------------ note actions ------------------------------ */
function newNote(template) {
  openEditor(null, { template: template });
}

function openNote(id) {
  if (!S.notes[id]) return;
  openEditor(id);
}

function togglePin(id) {
  const n = S.notes[id];
  if (!n) return;
  n.pinned = !n.pinned;
  n.updatedAt = Date.now();
  persistNotes();
  renderHome();
  toast(n.pinned ? 'Pinned' : 'Unpinned');
}

function duplicateNote(id) {
  const n = S.notes[id];
  if (!n) return;
  const copy = sanitizeNote({
    id: uid(),
    title: n.title + ' (copy)',
    content: n.content,
    createdAt: Date.now(),
    updatedAt: Date.now(),
    pinned: false
  });
  S.notes[copy.id] = copy;
  persistNotes();
  renderHome();
  toast('Duplicated');
}

function deleteNote(id, opts) {
  const n = S.notes[id];
  if (!n) return;
  delete S.notes[id];
  n.deletedAt = Date.now();
  S.recycle.unshift(n);
  if (S.recycle.length > 100) S.recycle.length = 100;
  persistNotes();
  persistRecycle();
  if (S.currentId === id) S.currentId = null;
  renderHome();
  if (!opts || !opts.silent) {
    toast('Moved to Recycle Bin', {
      action: {
        label: 'Undo',
        fn: () => { restoreFromRecycle(n.id); }
      },
      duration: 4600
    });
  }
}

function restoreFromRecycle(id) {
  const i = S.recycle.findIndex((r) => r.id === id);
  if (i === -1) return;
  const n = S.recycle.splice(i, 1)[0];
  delete n.deletedAt;
  let nid = n.id;
  if (S.notes[nid]) nid = uid();
  n.id = nid;
  n.updatedAt = Date.now();
  S.notes[nid] = n;
  persistNotes();
  persistRecycle();
  renderHome();
  toast('Restored');
}

function openNoteMenu(id) {
  const n = S.notes[id];
  if (!n) return;
  sheet.open('Note options', (body) => {
    const list = document.createElement('div');
    list.className = 'sheet-list';
    list.appendChild(menuItem({ icon: 'i-file', label: 'Open', fn: () => { sheet.close(); openNote(id); } }));
    list.appendChild(menuItem({ icon: 'i-pin', label: n.pinned ? 'Unpin' : 'Pin to top', fn: () => { sheet.close(); togglePin(id); } }));
    list.appendChild(menuItem({ icon: 'i-copy', label: 'Duplicate', fn: () => { sheet.close(); duplicateNote(id); } }));
    list.appendChild(menuItem({ icon: 'i-export', label: 'Export', sub: 'Markdown · HTML · plain text', fn: () => { sheet.close(); exportNoteMenu(id); } }));
    list.appendChild(menuItem({ icon: 'i-print', label: 'Print / Save as PDF', fn: () => { sheet.close(); openNote(id); setTimeout(() => openPrintOptions(), 350); } }));
    list.appendChild(menuItem({ icon: 'i-trash', label: 'Delete', danger: true, fn: async () => {
      sheet.close();
      const ok = await confirmDialog({ title: 'Delete note?', message: '“' + n.title + '” will move to the Recycle Bin. You can restore it any time.', okText: 'Delete', danger: true });
      if (ok) deleteNote(id);
    } }));
    body.appendChild(list);
  });
}

/* ------------------------------ recycle bin ------------------------------ */
function openRecycle() {
  sheet.open('Recycle Bin', (body) => {
    const render = () => {
      body.innerHTML = '';
      if (!S.recycle.length) {
        const p = document.createElement('p');
        p.className = 'sheet-note';
        p.textContent = 'Recycle Bin is empty. Deleted notes stay here until you remove them.';
        body.appendChild(p);
        return;
      }
      S.recycle.forEach((n) => {
        const row = document.createElement('div');
        row.className = 'rec-row';
        const main = document.createElement('div');
        main.className = 'rec-main';
        const t = document.createElement('div');
        t.className = 'rec-title';
        t.textContent = n.title || 'Untitled note';
        const s = document.createElement('div');
        s.className = 'rec-sub';
        s.textContent = 'Deleted ' + formatDate(n.deletedAt);
        main.appendChild(t); main.appendChild(s);
        const acts = document.createElement('div');
        acts.className = 'rec-actions';
        const rb = document.createElement('button');
        rb.type = 'button'; rb.className = 'icon-mini'; rb.setAttribute('aria-label', 'Restore');
        rb.innerHTML = '<svg><use href="#i-restore"/></svg>';
        rb.addEventListener('click', () => { restoreFromRecycle(n.id); render(); });
        const db = document.createElement('button');
        db.type = 'button'; db.className = 'icon-mini danger'; db.setAttribute('aria-label', 'Delete forever');
        db.innerHTML = '<svg><use href="#i-trash"/></svg>';
        db.addEventListener('click', async () => {
          const ok = await confirmDialog({ title: 'Delete forever?', message: 'This cannot be undone.', okText: 'Delete', danger: true });
          if (!ok) return;
          S.recycle = S.recycle.filter((r) => r.id !== n.id);
          persistRecycle();
          render();
          toast('Deleted permanently');
        });
        acts.appendChild(rb); acts.appendChild(db);
        row.appendChild(main); row.appendChild(acts);
        body.appendChild(row);
      });

      const emptyBtn = document.createElement('button');
      emptyBtn.type = 'button';
      emptyBtn.className = 'btn btn-danger btn-block';
      emptyBtn.style.marginTop = '16px';
      emptyBtn.textContent = 'Empty Recycle Bin';
      emptyBtn.addEventListener('click', async () => {
        const ok = await confirmDialog({ title: 'Empty Recycle Bin?', message: 'All ' + S.recycle.length + ' deleted notes will be removed permanently.', okText: 'Empty', danger: true });
        if (!ok) return;
        S.recycle = [];
        persistRecycle();
        render();
        toast('Recycle Bin emptied');
      });
      body.appendChild(emptyBtn);
    };
    render();
  });
}

/* =====================================================================
   MARKDOWN + MATH + DIAGRAM ENGINE
   ===================================================================== */

const CALLOUT_META = {
  note:      { icon: '\u2139\uFE0F', label: 'Note' },
  tip:       { icon: '\uD83D\uDCA1', label: 'Tip' },
  important: { icon: '\u2757', label: 'Important' },
  warning:   { icon: '\u26A0\uFE0F', label: 'Warning' },
  caution:   { icon: '\u26D4', label: 'Caution' },
  success:   { icon: '\u2705', label: 'Success' },
  question:  { icon: '\u2753', label: 'Question' },
  example:   { icon: '\uD83D\uDCD8', label: 'Example' }
};

const GREEK = {
  alpha: 'α', beta: 'β', gamma: 'γ', delta: 'δ', Delta: 'Δ', epsilon: 'ε', varepsilon: 'ε',
  zeta: 'ζ', eta: 'η', theta: 'θ', Theta: 'Θ', iota: 'ι', kappa: 'κ', lambda: 'λ', Lambda: 'Λ',
  mu: 'μ', nu: 'ν', xi: 'ξ', pi: 'π', Pi: 'Π', rho: 'ρ', sigma: 'σ', Sigma: 'Σ', tau: 'τ',
  upsilon: 'υ', phi: 'φ', varphi: 'φ', Phi: 'Φ', chi: 'χ', psi: 'ψ', Psi: 'Ψ', omega: 'ω', Omega: 'Ω'
};
const LITE_SYM = {
  cdot: '·', times: '×', div: '÷', pm: '±', mp: '∓', le: '≤', leq: '≤', ge: '≥', geq: '≥',
  ne: '≠', neq: '≠', approx: '≈', equiv: '≡', sim: '∼', propto: '∝', infty: '∞',
  sum: '∑', prod: '∏', int: '∫', oint: '∮', partial: '∂', nabla: '∇',
  rightarrow: '→', to: '→', leftarrow: '←', Rightarrow: '⇒', Leftarrow: '⇐',
  leftrightarrow: '↔', Rightleftarrow: '⇄', therefore: '∴', because: '∵',
  degree: '°', circ: '∘', angle: '∠', perp: '⊥', parallel: '∥',
  in: '∈', notin: '∉', subset: '⊂', supset: '⊃', cup: '∪', cap: '∩', emptyset: '∅',
  forall: '∀', exists: '∃', neg: '¬', land: '∧', lor: '∨',
  ldots: '…', cdots: '⋯', dots: '…', quad: ' ', qquad: '\u2003', space: ' ',
  left: '', right: '', displaystyle: '', ',': '\u2009', ';': '\u2005', ':': '\u2005', '!': ''
};

function matchGroup(s, start) {
  if (s[start] !== '{') return null;
  let depth = 0;
  for (let i = start; i < s.length; i++) {
    if (s[i] === '\\') { i++; continue; }
    if (s[i] === '{') depth++;
    else if (s[i] === '}') { depth--; if (depth === 0) return { content: s.slice(start + 1, i), end: i + 1 }; }
  }
  return null;
}

function liteMathInner(src) {
  let s = String(src);
  let guard = 0;

  while (guard++ < 300) {
    const m = /\\[dt]?frac\s*/.exec(s);
    if (!m) break;
    let p = m.index + m[0].length;
    if (s[p] !== '{') break;
    const g1 = matchGroup(s, p);
    if (!g1) break;
    p = g1.end;
    while (s[p] === ' ') p++;
    if (s[p] !== '{') break;
    const g2 = matchGroup(s, p);
    if (!g2) break;
    const html = '<span class="lite-frac"><span class="num">' + liteMathInner(g1.content) +
                 '</span><span class="den">' + liteMathInner(g2.content) + '</span></span>';
    s = s.slice(0, m.index) + html + s.slice(g2.end);
  }

  guard = 0;
  while (guard++ < 400) {
    const m = /\\sqrt\s*/.exec(s);
    if (!m) break;
    let p = m.index + m[0].length;
    let index = '';
    if (s[p] === '[') {
      const close = s.indexOf(']', p);
      if (close === -1) break;
      index = s.slice(p + 1, close);
      p = close + 1;
    }
    if (s[p] !== '{') break;
    const g = matchGroup(s, p);
    if (!g) break;
    const html = '<span class="lite-sqrt">' + (index ? '<sup>' + liteMathInner(index) + '</sup>' : '') +
                 '<span class="radicand">' + liteMathInner(g.content) + '</span></span>';
    s = s.slice(0, m.index) + html + s.slice(g.end);
  }

  s = s.replace(/\\(?:text|mathrm|textrm|operatorname|mathbf)\s*\{([^{}]*)\}/g, (m, t) => '<span style="font-style:normal">' + t + '</span>');
  s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/\^(\S)/g, '<sup>$1</sup>');
  s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>').replace(/_(\S)/g, '<sub>$1</sub>');
  s = s.replace(/\\([A-Za-z]+)/g, (m, n) => (GREEK[n] != null ? GREEK[n] : (LITE_SYM[n] != null ? LITE_SYM[n] : '')));
  s = s.replace(/\\[,;:!]/g, '\u2009');
  s = s.replace(/\\\\/g, '<br>');
  s = s.replace(/[{}]/g, '');
  return s.trim();
}

function liteMath(tex) {
  return '<span class="lite-math">' + liteMathInner(escapeHtml(tex)) + '</span>';
}

function renderMath(tex, display) {
  S.mathCount++;
  const engine = S.settings.mathEngine;
  const useKatex = S.katexOk && engine !== 'lite';
  if (useKatex) {
    try {
      return window.katex.renderToString(tex, {
        displayMode: !!display,
        throwOnError: false,
        errorColor: '#DC2626',
        strict: 'ignore',
        trust: false,
        macros: { '\\RR': '\\mathbb{R}', '\\NN': '\\mathbb{N}' }
      });
    } catch (e) { /* fall through to lite */ }
  }
  return liteMath(tex);
}

/* --- math protection: turn every math span into a token --------------- */
function protectMath(text, store) {
  const push = (tex, display) => {
    const src = String(tex).replace(/\u00a0/g, ' ').trim();
    if (!src) return '';
    store.push({ tex: src, display: !!display });
    return 'NSMATHX' + (store.length - 1) + 'XNS';
  };

  // \[ ... \]  → display
  text = text.replace(/\\\[([\s\S]*?)\\\]/g, (m, p1) => push(p1, true));
  // \( ... \)  → inline
  text = text.replace(/\\\(([\s\S]*?)\\\)/g, (m, p1) => push(p1, false));
  // $$ ... $$  → display
  text = text.replace(/\$\$([\s\S]*?)\$\$/g, (m, p1) => push(p1, true));

  // $ ... $ inline (guarded scanner)
  let out = '';
  let i = 0;
  while (i < text.length) {
    const ch = text[i];
    if (ch === '\\' && text[i + 1] === '$') { out += '\\$'; i += 2; continue; }
    if (ch === '$') {
      const next = text[i + 1] || '';
      if (next && !/[\s$]/.test(next)) {
        let j = i + 1;
        let close = -1;
        while (j < text.length) {
          const c = text[j];
          if (c === '\\') { j += 2; continue; }
          if (c === '\n') break;
          if (c === '$') {
            const prev = text[j - 1] || '';
            const after = text[j + 1] || '';
            if (!/\s/.test(prev) && !/[0-9]/.test(after)) close = j;
            break;
          }
          j++;
        }
        if (close > i + 1) {
          out += push(text.slice(i + 1, close), false);
          i = close + 1;
          continue;
        }
      }
    }
    out += ch;
    i++;
  }
  return out;
}

/* --- bare LaTeX lines: "\Delta \phi = k\Delta x = 0.4\pi" ----------- */
function looksLikeBareLatex(line) {
  const t = line.trim();
  if (!t || t.length > 400) return false;
  if (/^[>#`|]/.test(t)) return false;
  if (t.indexOf('$') !== -1) return false;
  if (t.indexOf('NSMATHX') !== -1) return false;
  if (/\\[()\[\]]/.test(t)) return false;
  const cmds = t.match(/\\[A-Za-z]+/g) || [];
  if (!cmds.length) return false;
  if (cmds.length < 2 && !/\\[a-zA-Z]*(frac|sqrt|vec|hat|bar)/.test(t) && !/=/.test(t)) return false;
  const rest = t.replace(/\\[A-Za-z]+/g, ' ').replace(/\{[^{}]*\}/g, ' ');
  if (/[A-Za-z]{3,}/.test(rest)) return false;
  if (/[^\sA-Za-z0-9=+\-*/^_().,'"|\[\]:;!<>]/.test(rest)) return false;
  return true;
}

/* A line that is pure LaTeX becomes display math (runs AFTER protectMath,
   so it can never fight with \[ ... \] blocks). */
function autoWrapBareLatex(text, store) {
  if (!S.settings.bareLatex) return text;
  const push = (tex) => {
    store.push({ tex: tex.trim(), display: true });
    return 'NSMATHX' + (store.length - 1) + 'XNS';
  };
  return String(text).split('\n').map((line) => {
    if (/^\s*>/.test(line)) return line;
    if (!looksLikeBareLatex(line)) return line;
    const lead = line.match(/^\s*/)[0];
    return lead + push(line);
  }).join('\n');
}

/* --- callouts outside code fences ------------------------------------- */
function protectCallouts(text, store) {
  const lines = text.split('\n');
  const head = /^>\s*\[!(\w+)\]\s*(.*)$/i;
  const res = [];
  let i = 0;
  while (i < lines.length) {
    const m = lines[i].match(head);
    if (!m) { res.push(lines[i]); i++; continue; }
    const type = String(m[1] || '').toLowerCase();
    if (!CALLOUT_META[type]) { res.push(lines[i]); i++; continue; }
    const title = String(m[2] || '').trim();
    const body = [];
    i++;
    while (i < lines.length) {
      const L = lines[i];
      if (/^>/.test(L)) {
        if (head.test(L)) break;
        body.push(L.replace(/^>\s?/, ''));
        i++;
        continue;
      }
      if (L.trim() === '') {
        let j = i + 1;
        while (j < lines.length && lines[j].trim() === '') j++;
        if (j < lines.length && /^>/.test(lines[j]) && !head.test(lines[j])) {
          body.push('');
          i++;
          continue;
        }
      }
      break;
    }
    store.push({ type: type, title: title, body: body.join('\n') });
    res.push('');
    res.push('<div data-nscallout="' + (store.length - 1) + '"></div>');
    res.push('');
  }
  return res.join('\n');
}

/* --- run a transform only outside ``` fences -------------------------- */
function outsideFences(src, fn) {
  const lines = String(src).split('\n');
  const out = [];
  let textBuf = [];
  let fenceBuf = null;

  const flushText = () => {
    if (!textBuf.length) return;
    out.push(fn(textBuf.join('\n')));
    textBuf = [];
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const isFence = /^\s{0,3}(```|~~~)/.test(line);
    if (isFence) {
      if (fenceBuf === null) { flushText(); fenceBuf = [line]; }
      else { fenceBuf.push(line); out.push(fenceBuf.join('\n')); fenceBuf = null; }
      continue;
    }
    if (fenceBuf !== null) fenceBuf.push(line);
    else textBuf.push(line);
  }
  if (fenceBuf !== null) out.push(fenceBuf.join('\n'));
  flushText();
  return out.join('\n');
}

/* --- emergency markdown renderer (CDN blocked / offline first load) --- */
function liteMarkdown(src) {
  const inline = (t) => escapeHtml(t)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/==([^=\n]+)==/g, '<mark>$1</mark>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    .replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, '<img alt="$1" src="$2" loading="lazy">')
    .replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  const lines = String(src).split('\n');
  const out = [];
  let inCode = false;
  let codeLang = '';
  let codeBuf = [];
  let list = null;
  let para = [];

  const closeList = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  const flushPara = () => {
    if (para.length) { out.push('<p>' + para.map(inline).join(' ') + '</p>'); para = []; }
  };
  const isTableSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l || '');
  const splitRow = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    const fence = line.match(/^\s{0,3}(?:```|~~~)\s*([\w+#-]*)/);
    if (fence) {
      if (inCode) {
        out.push('<pre><code' + (codeLang ? ' class="language-' + escapeHtml(codeLang) + '"' : '') + '>' +
          escapeHtml(codeBuf.join('\n')) + '</code></pre>');
        codeBuf = []; codeLang = ''; inCode = false;
      } else {
        flushPara(); closeList(); inCode = true; codeLang = fence[1] || '';
      }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }

    // callout placeholder produced by protectCallouts — must pass through raw
    if (/^<div data-nscallout="\d+"><\/div>$/.test(line.trim())) {
      flushPara(); closeList(); out.push(line.trim()); continue;
    }

    if (!line.trim()) { flushPara(); closeList(); continue; }

    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara(); closeList();
      const n = h[1].length;
      out.push('<h' + n + '>' + inline(h[2]) + '</h' + n + '>');
      continue;
    }
    if (/^\s*([-*_])\s*\1\s*\1[\s\S]*$/.test(line) && line.trim().length >= 3) {
      flushPara(); closeList(); out.push('<hr>'); continue;
    }

    // GFM table
    if (line.indexOf('|') !== -1 && isTableSep(lines[i + 1])) {
      flushPara(); closeList();
      const head = splitRow(line);
      let t = '<div class="table-wrap"><table><thead><tr>' +
        head.map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && lines[i].indexOf('|') !== -1 && lines[i].trim()) {
        t += '<tr>' + splitRow(lines[i]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
        i++;
      }
      i--;
      t += '</tbody></table></div>';
      out.push(t);
      continue;
    }

    const q = line.match(/^>\s?(.*)$/);
    if (q) { flushPara(); closeList(); out.push('<blockquote><p>' + inline(q[1]) + '</p></blockquote>'); continue; }

    const ul = line.match(/^\s*[-*+]\s+(.*)$/);
    if (ul) {
      flushPara();
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push('<li>' + inline(ul[1]) + '</li>');
      continue;
    }
    const ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
    if (ol) {
      flushPara();
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push('<li>' + inline(ol[1]) + '</li>');
      continue;
    }
    if (list) closeList();
    para.push(line);
  }
  if (inCode) {
    out.push('<pre><code' + (codeLang ? ' class="language-' + escapeHtml(codeLang) + '"' : '') + '>' +
      escapeHtml(codeBuf.join('\n')) + '</code></pre>');
  }
  flushPara();
  closeList();
  return out.join('\n');
}

function mdParse(src) {
  if (S.markedOk) {
    try {
      return window.marked.parse(src, { gfm: true, breaks: false, headerIds: false, mangle: false });
    } catch (e) { /* fall back */ }
  }
  return liteMarkdown(src);
}

function purify(html, forSvg) {
  if (!window.DOMPurify) {
    // last-resort scrubber when the sanitizer could not load
    return String(html)
      .replace(/<\s*(script|iframe|object|embed|style|link|meta|base)\b[\s\S]*?<\s*\/\s*\1\s*>/gi, '')
      .replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
      .replace(/javascript:/gi, '');
  }
  const cfg = {
    USE_PROFILES: forSvg ? { svg: true, svgFilters: true } : { html: true, svg: true, svgFilters: true },
    FORBID_TAGS: ['style', 'script', 'iframe', 'object', 'embed', 'link', 'meta', 'base', 'form'],
    FORBID_ATTR: ['srcdoc'],
    ADD_ATTR: ['target', 'rel', 'loading']
  };
  try { return DOMPurify.sanitize(html, cfg); } catch (e) { return html; }
}

let purifyHooked = false;
function hookPurify() {
  if (purifyHooked || !window.DOMPurify) return;
  purifyHooked = true;
  DOMPurify.addHook('afterSanitizeAttributes', (node) => {
    if (node.tagName === 'A') {
      node.setAttribute('target', '_blank');
      node.setAttribute('rel', 'noopener noreferrer');
    }
    if (node.tagName === 'IMG') node.setAttribute('loading', 'lazy');
  });
}

/* --- main render ------------------------------------------------------ */
function buildHtml(raw) {
  const mathStore = [];
  const calloutStore = [];
  S.mathCount = 0;

  let text = outsideFences(raw, (chunk) => {
    let t = protectMath(chunk, mathStore);
    t = autoWrapBareLatex(t, mathStore);
    t = t.replace(/(^|[\s(])==([^=\s][^=\n]*?)==(?=[\s).,;:!?]|$)/g, '$1<mark>$2</mark>');
    t = protectCallouts(t, calloutStore);
    return t;
  });

  let html = mdParse(text);

  // expand callouts (their bodies are markdown too)
  if (calloutStore.length) {
    html = html.replace(/<div data-nscallout="(\d+)"><\/div>/g, (m, idx) => {
      const c = calloutStore[Number(idx)];
      if (!c) return '';
      const meta = CALLOUT_META[c.type] || CALLOUT_META.note;
      const bodyHtml = c.body.trim() ? mdParse(c.body) : '';
      const title = c.title ? escapeHtml(c.title) : meta.label;
      return '<div class="callout ' + c.type + '">' +
        '<div class="callout-title"><span aria-hidden="true">' + meta.icon + '</span><span>' + title + '</span></div>' +
        (bodyHtml ? '<div class="callout-body">' + bodyHtml + '</div>' : '') +
        '</div>';
    });
  }

  // sanitize everything that came from the note
  html = purify(html);

  // math is generated by us (KaTeX/lite) so it is restored after sanitizing
  if (mathStore.length) {
    html = html.split(/NSMATHX(\d+)XNS/g).map((part, i) => {
      if (i % 2 === 0) return part;
      const m = mathStore[Number(part)];
      if (!m) return '';
      const rendered = renderMath(m.tex, m.display);
      return m.display ? '<div class="math-block">' + rendered + '</div>' : rendered;
    }).join('');
  }
  return html;
}

function emptyPreviewMessage() {
  return '<div class="empty" style="padding-top:34px">' +
    '<div class="empty-art"><svg><use href="#i-sparkle"/></svg></div>' +
    '<h2>Start writing</h2>' +
    '<p>Type on the left. Switch to <b>Read</b> to see the finished page, or <b>Split</b> to see both.</p>' +
    '<div class="empty-actions">' +
    '<button class="btn" type="button" data-act="template">Load a template</button>' +
    '<button class="btn" type="button" data-act="help">Syntax help</button>' +
    '</div></div>';
}

let renderGen = 0;

function renderNow() {
  const prev = $('#preview');
  if (!prev) return;
  const badge = $('#statRender');
  const heavy = (S.content || '').length > 30000;
  if (badge) badge.hidden = !heavy;
  if (heavy) setTimeout(() => { if (badge) badge.hidden = true; }, 400);
  return renderNowInner(prev);
}

function renderNowInner(prev) {
  const gen = ++renderGen;
  const raw = S.content || '';
  S.mathCount = 0;

  if (!raw.trim()) {
    prev.innerHTML = emptyPreviewMessage();
    applyReaderSettings();
    updateStats();
    bindPreviewDelegates(prev);
    return Promise.resolve();
  }

  let html;
  try {
    html = buildHtml(raw);
  } catch (e) {
    html = '<div class="diagram-err">Render error: ' + escapeHtml(String(e && e.message || e)) + '</div>';
  }
  if (gen !== renderGen) return;

  prev.innerHTML = html;
  applyReaderSettings();
  enhance(prev);
  updateStats();
  const job = (gen === renderGen) ? renderDiagrams(prev, gen) : Promise.resolve();
  return job || Promise.resolve();
}

function scheduleRender(delay) {
  clearTimeout(S.renderTimer);
  S.renderTimer = setTimeout(renderNow, delay == null ? 380 : delay);
}

/* --- post-processing on already-sanitized DOM -------------------------- */
function enhance(root) {
  // task lists (marked emits disabled checkboxes; we make them live)
  let taskIdx = 0;
  Array.from(root.querySelectorAll('li')).forEach((li) => {
    let cb = li.querySelector('input[type="checkbox"]');
    const literal = !cb && /^\s*\[([ xX])\]\s+/.test(li.textContent || '');
    if (!cb && !literal) return;

    if (!cb) {
      const checked = /^\s*\[[xX]\]/.test(li.textContent || '');
      cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = checked;
      let stripped = false;
      const walker = document.createTreeWalker(li, NodeFilter.SHOW_TEXT);
      let node;
      while ((node = walker.nextNode())) {
        if (/^\s*\[([ xX])\]\s+/.test(node.nodeValue)) {
          node.nodeValue = node.nodeValue.replace(/^\s*\[([ xX])\]\s+/, '');
          stripped = true;
          break;
        }
      }
      if (!stripped) return;
      li.insertBefore(cb, li.firstChild);
    }

    const idx = taskIdx++;
    cb.removeAttribute('disabled');
    cb.disabled = false;
    cb.dataset.task = String(idx);
    cb.setAttribute('aria-label', 'Toggle task');
    li.classList.add('task-item');
    li.classList.toggle('done', cb.checked);

    if (!li.querySelector('span.task-text')) {
      const wrap = document.createElement('span');
      wrap.className = 'task-text';
      while (cb.nextSibling) wrap.appendChild(cb.nextSibling);
      li.appendChild(wrap);
    }
    if (li.parentElement && !li.parentElement.classList.contains('task-list')) {
      li.parentElement.classList.add('task-list');
    }
  });

  // code blocks: header + copy
  Array.from(root.querySelectorAll('pre')).forEach((pre) => {
    if (pre.closest('.code-block')) return;
    const code = pre.querySelector('code');
    if (!code) return;
    let lang = '';
    const cls = code.className || '';
    const m = cls.match(/language-([\w+#-]+)/);
    if (m) lang = m[1];
    if (lang === 'mermaid' || lang === 'svg') return; // handled by renderDiagrams
    const box = document.createElement('div');
    box.className = 'code-block';
    const head = document.createElement('div');
    head.className = 'code-head';
    const label = document.createElement('span');
    label.textContent = lang || 'code';
    const copy = document.createElement('button');
    copy.type = 'button';
    copy.className = 'code-copy';
    copy.textContent = 'Copy';
    copy.dataset.copy = '1';
    head.appendChild(label);
    head.appendChild(copy);
    pre.parentNode.insertBefore(box, pre);
    box.appendChild(head);
    box.appendChild(pre);
  });

  // tables scroll wrapper
  Array.from(root.querySelectorAll('table')).forEach((t) => {
    if (t.parentElement && t.parentElement.classList.contains('table-wrap')) return;
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.parentNode.insertBefore(wrap, t);
    wrap.appendChild(t);
  });
}

function renderDiagrams(root, gen) {
  const jobs = [];
  const mm = Array.from(root.querySelectorAll('pre > code.language-mermaid'));
  const svgs = Array.from(root.querySelectorAll('pre > code.language-svg'));

  svgs.forEach((code) => {
    const pre = code.parentElement;
    if (!pre) return;
    const holder = document.createElement('div');
    holder.className = 'svg-block';
    const src = code.textContent || '';
    holder.innerHTML = purify(src, true);
    pre.parentNode.replaceChild(holder, pre);
  });

  if (!mm.length || !S.settings.mermaid) return Promise.all(jobs);

  mm.forEach((code) => {
    const pre = code.parentElement;
    if (!pre) return;
    const holder = document.createElement('div');
    holder.className = 'diagram';
    const inner = document.createElement('div');
    inner.className = 'diagram-inner';
    inner.textContent = 'Rendering diagram…';
    holder.appendChild(inner);
    pre.parentNode.replaceChild(holder, pre);

    const src = code.textContent || '';
    if (!src.trim()) { holder.remove(); return; }

    if (!S.mermaidOk) {
      holder.innerHTML = '<div class="diagram-err">Mermaid not available offline yet. The source stays below.</div><pre class="diagram-src"><code>' + escapeHtml(src) + '</code></pre>';
      return;
    }
    const id = 'nsmm' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
    const job = window.mermaid.render(id, src).then((res) => {
      if (gen != null && gen !== renderGen) return;
      inner.innerHTML = res.svg;
    }).catch((err) => {
      if (gen != null && gen !== renderGen) return;
      holder.innerHTML = '<div class="diagram-err">Diagram error: ' + escapeHtml(String(err && err.message || err)) +
        '</div><pre class="diagram-src"><code>' + escapeHtml(src) + '</code></pre>';
    });
    jobs.push(job);
  });
  return Promise.all(jobs);
}

/* --- delegated clicks inside preview ---------------------------------- */
function bindPreviewDelegates(prev) {
  if (prev.dataset.bound) return;
  prev.dataset.bound = '1';
  on(prev, 'click', (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      const box = copyBtn.closest('.code-block');
      const code = box ? box.querySelector('code') : null;
      const text = code ? code.textContent : '';
      copyText(text).then(() => toast('Copied')).catch(() => toast('Could not copy'));
      return;
    }
    const act = e.target.closest('[data-act]');
    if (act) {
      if (act.dataset.act === 'template') openTemplates();
      if (act.dataset.act === 'help') openHelp();
    }
  });
  on(prev, 'change', (e) => {
    const cb = e.target.closest('input[type=checkbox][data-task]');
    if (!cb) return;
    toggleTaskInSource(Number(cb.dataset.task));
  });
}

function toggleTaskInSource(index) {
  let count = -1;
  let changed = false;
  const next = outsideFences(S.content, (chunk) => chunk.replace(/^(\s*[-*+]\s+\[)([ xX])(\]\s+)/gm, (m, a, mark, b) => {
    count++;
    if (count !== index) return m;
    changed = true;
    return a + (mark.toLowerCase() === 'x' ? ' ' : 'x') + b;
  }));
  if (!changed) return;
  S.content = next;
  const ta = $('#editor');
  if (ta) ta.value = next;
  S.dirty = true;
  handleInput();
  renderNow();
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      resolve();
    } catch (e) { reject(e); }
  });
}

/* =====================================================================
   EDITOR
   ===================================================================== */

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#' + name);
  svg.appendChild(use);
  return svg;
}

function applyReaderSettings() {
  const prev = $('#preview');
  if (!prev) return;
  prev.style.setProperty('--reader-fs', S.fontSize + 'px');
  prev.dataset.font = S.settings.readerFont || 'sans';
  prev.classList.remove('cols-1', 'cols-2', 'cols-3', 'cols-4');
  prev.classList.add('cols-' + clamp(S.cols, 1, 4));
  $$('#colSeg button').forEach((b) => b.classList.toggle('on', Number(b.dataset.cols) === S.cols));
  const panes = $('#panes');
  if (panes) panes.style.setProperty('--split', S.split + '%');
}

function setMode(mode) {
  S.mode = mode;
  S.settings.mode = mode;
  saveSettings();
  const scr = $('#editorScreen');
  scr.classList.remove('mode-edit', 'mode-split', 'mode-read');
  scr.classList.add('mode-' + mode);
  $$('.segmented button').forEach((b) => {
    const onNow = b.dataset.mode === mode;
    b.classList.toggle('on', onNow);
    b.setAttribute('aria-selected', onNow ? 'true' : 'false');
  });
  if (mode !== 'edit') scheduleRender(0);
  if (mode === 'read') $('#previewPane').scrollTop = 0;
}

function updateSaveState(savedOnly) {
  const txt = $('#saveStateTxt');
  const box = $('#saveState');
  if (!txt || !box) return;
  box.classList.toggle('saving', !savedOnly && S.dirty);
  if (!savedOnly && S.dirty) {
    txt.textContent = 'Editing…';
  } else {
    const when = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    txt.textContent = S.currentId ? 'Saved · ' + when : 'Draft · not saved yet';
  }
}

function updateStats() {
  const raw = S.content || '';
  const plain = raw.replace(/```[\s\S]*?```/g, ' ').replace(/NSMATHX\d+XNS/g, ' ');
  const words = wordCount(plain);
  const read = words ? Math.max(1, Math.round(words / 180)) : 0;
  const w = $('#statWords');
  const m = $('#statMeta');
  const e = $('#statMath');
  if (w) w.textContent = words + (words === 1 ? ' word' : ' words');
  if (m) m.textContent = raw.length ? raw.length + ' chars' + (read ? ' · ~' + read + ' min read' : '') : '';
  if (e) e.textContent = S.mathCount ? S.mathCount + ' equation' + (S.mathCount > 1 ? 's' : '') : '';
}

function saveDraft() {
  if (!S.settings.autosave) return;
  const titleEl = $('#titleInput');
  const draft = {
    id: S.currentId || null,
    title: titleEl ? titleEl.value : S.title,
    content: S.content,
    savedAt: Date.now()
  };
  if (!String(draft.content).trim() && !String(draft.title || '').trim()) { LS.del(K.draft); return; }
  if (!LS.set(K.draft, draft)) toast('Storage full — draft could not be saved');
}

function clearDraft() { LS.del(K.draft); }

function handleInput() {
  S.dirty = true;
  updateSaveState(false);
  updateStats();
  clearTimeout(S.draftTimer);
  S.draftTimer = setTimeout(saveDraft, 800);

  if (S.mode === 'split' && S.settings.autoPreview) {
    // very long notes: keep typing lag-free, preview only on demand
    if ((S.content || '').length > 60000) {
      const badge = $('#statRender');
      if (badge) { badge.hidden = false; badge.textContent = 'Tap Read to refresh'; }
    } else {
      const badge = $('#statRender');
      if (badge) badge.textContent = 'Rendering…';
      scheduleRender(420);
    }
  }

  if (S.settings.autosave && S.currentId) {
    clearTimeout(S.saveTimer);
    S.saveTimer = setTimeout(() => {
      if (S.dirty) commitNote({ silent: true });
    }, 1600);
  }
}

function commitNote(opts) {
  opts = opts || {};
  const titleEl = $('#titleInput');
  const rawTitle = (titleEl ? titleEl.value : S.title) || '';
  const content = S.content || '';
  const title = rawTitle.trim() || deriveTitle(content);
  const prev = S.currentId ? S.notes[S.currentId] : null;

  if (!content.trim() && !title.trim()) {
    clearDraft();
    if (!prev) { S.currentId = null; }
    return null;
  }

  const now = Date.now();
  const id = prev ? prev.id : uid();
  const note = {
    id: id,
    title: title || 'Untitled note',
    content: content,
    createdAt: prev ? prev.createdAt : now,
    updatedAt: now,
    pinned: prev ? !!prev.pinned : false,
    tags: deriveTags(content)
  };
  S.notes[id] = note;
  S.currentId = id;
  persistNotes();
  clearDraft();
  S.dirty = false;
  updateSaveState(true);
  if (!opts.silent) toast(prev ? 'Note saved' : 'Note created');
  return note;
}

function openEditor(id, opts) {
  opts = opts || {};
  let content = '';
  let title = '';
  let currentId = null;

  if (id && S.notes[id]) {
    const n = S.notes[id];
    content = n.content;
    title = n.title === 'Untitled note' ? '' : n.title;
    currentId = n.id;
  } else if (opts.draft) {
    const d = LS.get(K.draft, null);
    if (d) {
      content = d.content || '';
      title = d.title || '';
      currentId = (d.id && S.notes[d.id]) ? d.id : null;
    }
  } else if (opts.template) {
    content = opts.template.content || '';
  } else {
    const d = LS.get(K.draft, null);
    if (d && String(d.content || '').trim()) {
      content = d.content;
      title = d.title || '';
      currentId = (d.id && S.notes[d.id]) ? d.id : null;
      setTimeout(() => toast('Draft restored'), 320);
    }
  }

  S.currentId = currentId;
  S.content = content;
  S.title = title;
  S.dirty = false;

  const titleInput = $('#titleInput');
  titleInput.value = title;
  titleInput.placeholder = 'Untitled note';
  $('#editor').value = content;
  $('#preview').innerHTML = '';

  S.mode = 'edit';
  const startMode = content.trim() ? (S.settings.mode || 'edit') : 'edit';
  setMode(startMode === 'split' ? 'split' : (startMode === 'read' ? 'read' : 'edit'));
  applyReaderSettings();
  updateStats();
  updateSaveState(true);
  bindPreviewDelegates($('#preview'));

  S.view = 'editor';
  $('#editorScreen').classList.add('open');
  scheduleRender(0);

  if (!content) {
    setTimeout(() => { try { $('#editor').focus(); } catch (e) {} }, 280);
  }
}

function closeEditorUI(fromPop) {
  if (S.view !== 'editor') return;
  clearTimeout(S.saveTimer);
  clearTimeout(S.draftTimer);
  if (S.dirty || (S.content && !S.currentId)) commitNote({ silent: true });
  S.view = 'home';
  $('#editorScreen').classList.remove('open');
  S.currentId = null;
  S.content = '';
  S.dirty = false;
  renderHome();
}

/* ------------------------------ formatting ------------------------------ */
function ta() { return $('#editor'); }

function replaceRange(textarea, start, end, insert, selStart, selEnd) {
  textarea.setRangeText(insert, start, end, 'end');
  if (selStart != null) {
    try { textarea.setSelectionRange(selStart, selEnd == null ? selStart : selEnd); } catch (e) {}
  }
  handleInput();
}

function wrapSelection(before, after, placeholder) {
  const t = ta();
  if (!t) return;
  t.focus();
  const start = t.selectionStart;
  const end = t.selectionEnd;
  const sel = t.value.slice(start, end) || placeholder || '';
  const insert = before + sel + after;
  const s = start + before.length;
  replaceRange(t, start, end, insert, s, s + sel.length);
}

function insertBlock(text, cursorOffset) {
  const t = ta();
  if (!t) return;
  t.focus();
  const start = t.selectionStart;
  const end = t.selectionEnd;
  const before = t.value.slice(0, start);
  const needsNL = before && !/\n$/.test(before) ? '\n\n' : '';
  const insert = needsNL + text;
  const caret = start + insert.length - (cursorOffset || 0);
  replaceRange(t, start, end, insert, caret);
}

function prefixLines(prefix, numbered) {
  const t = ta();
  if (!t) return;
  t.focus();
  const v = t.value;
  const s = t.selectionStart;
  const e = t.selectionEnd;
  const lineStart = v.lastIndexOf('\n', Math.max(0, s - 1)) + 1;
  let lineEnd = v.indexOf('\n', e);
  if (lineEnd === -1) lineEnd = v.length;
  const block = v.slice(lineStart, lineEnd);
  const lines = block.split('\n');
  const allHave = lines.every((l) => !l.trim() || l.startsWith(prefix) || (numbered && /^\d+[.)]\s/.test(l)));
  let n = 0;
  const next = lines.map((l) => {
    if (!l.trim()) return l;
    if (allHave) {
      return numbered ? l.replace(/^\d+[.)]\s+/, '') : l.slice(prefix.length);
    }
    n++;
    return (numbered ? n + '. ' : prefix) + l;
  }).join('\n');
  replaceRange(t, lineStart, lineEnd, next, lineStart, lineStart + next.length);
}

const TABLE_SNIPPET = '| Quantity | Formula | Unit |\n| --- | --- | --- |\n| Force | $F = ma$ | N |\n| Work | $W = Fd$ | J |';
const MERMAID_SNIPPET = '```mermaid\ngraph TD\n  A[Read the chapter] --> B[Make notes]\n  B --> C[Solve PYQs]\n  C --> D{Score > 80%?}\n  D -- Yes --> E[Revise formulas]\n  D -- No --> B\n```';
const SVG_SNIPPET = '```svg\n<svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">\n  <rect x="5" y="5" width="190" height="90" rx="12" fill="#EEF4FF" stroke="#2563EB"/>\n  <circle cx="60" cy="50" r="26" fill="#2563EB" opacity="0.15"/>\n  <text x="100" y="56" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#1E3A8A">Notes Studio</text>\n</svg>\n```';

function mdAction(action) {
  switch (action) {
    case 'bold': wrapSelection('**', '**', 'bold text'); break;
    case 'italic': wrapSelection('*', '*', 'italic text'); break;
    case 'strike': wrapSelection('~~', '~~', 'struck text'); break;
    case 'highlight': wrapSelection('==', '==', 'important'); break;
    case 'code': wrapSelection('`', '`', 'code'); break;
    case 'h1': prefixLines('# '); break;
    case 'h2': prefixLines('## '); break;
    case 'h3': prefixLines('### '); break;
    case 'ul': prefixLines('- '); break;
    case 'ol': prefixLines('', true); break;
    case 'task': prefixLines('- [ ] '); break;
    case 'quote': prefixLines('> '); break;
    case 'inlineMath': wrapSelection('$', '$', 'x^2'); break;
    case 'blockMath': insertBlock('$$\n\n$$', 3); break;
    case 'bracketMath': insertBlock('\\[\n\n\\]', 3); break;
    case 'table': insertBlock(TABLE_SNIPPET); break;
    case 'callout': insertBlock('> [!tip] Exam tip\n> Write the one line you must not forget.'); break;
    case 'hr': insertBlock('\n---\n'); break;
    case 'mermaid': insertBlock(MERMAID_SNIPPET); break;
    case 'svg': insertBlock(SVG_SNIPPET); break;
    case 'image': insertImagePrompt(); break;
    default: break;
  }
}

function insertImagePrompt() {
  promptDialog({ title: 'Insert image', placeholder: 'https://… or data:image/…', okText: 'Insert' }).then((url) => {
    if (!url) return;
    const clean = String(url).trim();
    if (!/^(https?:|data:image\/)/i.test(clean)) { toast('Use an http(s) or data:image URL'); return; }
    insertBlock('![' + deriveTitle(S.content, false) + '](' + clean + ')');
  });
}

/* ------------------------------ resizer ------------------------------ */
function initResizer() {
  const r = $('#resizer');
  const panes = $('#panes');
  if (!r || !panes) return;
  let dragging = false;

  const move = (e) => {
    if (!dragging) return;
    const rect = panes.getBoundingClientRect();
    const vertical = window.matchMedia('(max-width: 760px)').matches;
    let pct = vertical
      ? ((e.clientY - rect.top) / rect.height) * 100
      : ((e.clientX - rect.left) / rect.width) * 100;
    S.split = Math.round(clamp(pct, 22, 82));
    panes.style.setProperty('--split', S.split + '%');
    e.preventDefault();
  };
  const up = () => {
    if (!dragging) return;
    dragging = false;
    S.settings.split = S.split;
    saveSettings();
    document.body.style.userSelect = '';
  };
  on(r, 'pointerdown', (e) => {
    dragging = true;
    document.body.style.userSelect = 'none';
    try { r.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  on(r, 'pointermove', move);
  on(r, 'pointerup', up);
  on(r, 'pointercancel', up);
  on(r, 'lostpointercapture', up);
}

/* Paper sizes. `css` empty = let the device print dialog decide.
   `scale` keeps text readable on big sheets without changing the pt setting. */
const PAPER_DEFS = {
  auto:    { label: 'Auto (device)', css: '',               scale: 1,    w: 0 },
  a5:      { label: 'A5',            css: 'A5',             scale: 0.82, w: 148 },
  a4:      { label: 'A4',            css: 'A4',             scale: 1,    w: 210 },
  a3:      { label: 'A3',            css: 'A3',             scale: 1.25, w: 297 },
  a2:      { label: 'A2',            css: 'A2',             scale: 1.5,  w: 420 },
  b5:      { label: 'B5',            css: 'B5',             scale: 0.9,  w: 176 },
  b4:      { label: 'B4',            css: 'B4',             scale: 1.12, w: 250 },
  letter:  { label: 'Letter',        css: 'letter',         scale: 1,    w: 216 },
  legal:   { label: 'Legal',         css: 'legal',          scale: 1.05, w: 216 },
  tabloid: { label: 'Tabloid 11×17', css: '11in 17in',      scale: 1.3,  w: 279 }
};

function paperDef() {
  return PAPER_DEFS[S.settings.printPaper] || PAPER_DEFS.a3;
}

function paperMarginIn() {
  const m = Number(S.settings.printMargin);
  return isFinite(m) ? clamp(m, 0, 1.5) : 0.5;
}

/** @page rule — applied to the app AND embedded in exported HTML. */
function pageRule() {
  const p = paperDef();
  const margin = paperMarginIn();
  return '@page{' + (p.css ? 'size:' + p.css + ';' : '') + 'margin:' + margin + 'in}';
}

function setPrintPageStyle() {
  let st = document.getElementById('printDyn');
  if (!st) {
    st = document.createElement('style');
    st.id = 'printDyn';
    document.head.appendChild(st);
  }
  st.textContent = '@media print{' + pageRule() + '}';
}

function buildPrintMarkup() {
  const prev = $('#preview');
  const clone = prev.cloneNode(true);
  $$('.code-copy', clone).forEach((n) => n.remove());
  $$('.empty', clone).forEach((n) => n.remove());
  const titleEl = $('#titleInput');
  const title = ((titleEl && titleEl.value) || S.title || deriveTitle(S.content) || 'Note').trim();
  const cols = clamp(Number(S.settings.printCols) || 1, 1, 4);
  const base = Number(S.settings.printSize) || 11;
  const size = Math.round(base * paperDef().scale * 100) / 100;

  const page = document.createElement('div');
  page.className = 'print-page';
  page.style.fontSize = size + 'pt';

  if (S.settings.printTitle) {
    const h = document.createElement('div');
    h.className = 'print-title';
    h.textContent = title;
    page.appendChild(h);
  }
  const body = document.createElement('div');
  body.className = 'print-cols';
  if (cols > 1) {
    body.style.columnCount = cols;
    body.style.columnGap = cols >= 4 ? '14px' : (cols === 3 ? '18px' : '24px');
    body.style.columnRule = '1px solid #bbb';
    body.style.textAlign = 'justify';
  }
  body.innerHTML = clone.innerHTML;
  page.appendChild(body);
  return page;
}

async function doPrint() {
  if (S.sheetOpen) sheet.close();
  if (S.view !== 'editor') { toast('Open a note first'); return; }
  try { await renderNow(); } catch (e) {}
  setPrintPageStyle();
  const area = $('#printArea');
  area.innerHTML = '';
  area.appendChild(buildPrintMarkup());
  await new Promise((r) => setTimeout(r, 120));
  try { window.print(); } catch (e) { toast('Printing not available'); }
}

function openPrintOptions() {
  if (S.view !== 'editor') { toast('Open a note first'); return; }
  const t = $('#titleInput');
  S.title = t ? t.value : S.title;
  setPrintPageStyle();
  renderNow();

  sheet.open('Print / Save as PDF', (body) => {
    const hint = el('p', 'sheet-note');
    hint.style.cssText = 'margin:2px 0 10px;font-weight:600';
    const updateHint = () => {
      const pp = paperDef();
      const base = Number(S.settings.printSize) || 11;
      const eff = Math.round(base * pp.scale * 100) / 100;
      hint.textContent = (pp.css ? pp.label + ' page' : 'Device page') + ' · ' +
        paperMarginIn() + ' in margins · text ' + eff + ' pt' +
        (pp.scale !== 1 ? ' (' + base + ' pt × ' + pp.scale + ')' : '');
    };
    const mkGroup = (label, key, options) => {
      const g = el('div', 'opt-group');
      g.appendChild(el('label', null, label));
      const row = el('div', 'opt-row');
      options.forEach((o) => {
        const b = el('button', 'opt-pill' + (String(S.settings[key]) === String(o.v) ? ' on' : ''), o.t);
        b.type = 'button';
        b.addEventListener('click', () => {
          S.settings[key] = o.v;
          saveSettings();
          $$('.opt-pill', row).forEach((x) => x.classList.remove('on'));
          b.classList.add('on');
          setPrintPageStyle();
          updateHint();
        });
        row.appendChild(b);
      });
      g.appendChild(row);
      body.appendChild(g);
    };

    mkGroup('Columns', 'printCols', [
      { v: 1, t: '1 column' }, { v: 2, t: '2 columns' }, { v: 3, t: '3 columns' }, { v: 4, t: '4 columns' }
    ]);
    mkGroup('Paper size', 'printPaper', [
      { v: 'a3', t: 'A3' }, { v: 'a4', t: 'A4' }, { v: 'a5', t: 'A5' },
      { v: 'a2', t: 'A2' }, { v: 'b4', t: 'B4' }, { v: 'b5', t: 'B5' },
      { v: 'letter', t: 'Letter' }, { v: 'legal', t: 'Legal' },
      { v: 'tabloid', t: 'Tabloid' }, { v: 'auto', t: 'Auto (device)' }
    ]);
    mkGroup('Margins (all sides)', 'printMargin', [
      { v: 0.5, t: '0.5 in' }, { v: 0.25, t: '0.25 in' }, { v: 0, t: 'None' }, { v: 1, t: '1 in' }
    ]);
    mkGroup('Text size (base)', 'printSize', [
      { v: 9, t: '9 pt' }, { v: 10, t: '10 pt' }, { v: 11, t: '11 pt' },
      { v: 12, t: '12 pt' }, { v: 13, t: '13 pt' }, { v: 14, t: '14 pt' }
    ]);
    mkGroup('Title line', 'printTitle', [
      { v: true, t: 'Show title' }, { v: false, t: 'No title' }
    ]);
    updateHint();
    body.appendChild(hint);

    const note = el('p', 'sheet-note',
      'A3 / A2: pick the same paper size in the phone\'s print dialog — the page is already laid out for it, ' +
      'so a small margin stays small. If your printer driver only offers A4, choose “Auto (device)”.');
    body.appendChild(note);

    const row = el('div', 'sheet-actions');
    const go = el('button', 'btn btn-primary', 'Print / Save as PDF');
    go.type = 'button';
    go.addEventListener('click', () => { sheet.close(); setTimeout(doPrint, 60); });
    const html = el('button', 'btn', 'Export HTML');
    html.type = 'button';
    html.addEventListener('click', () => { sheet.close(); exportNote(S.currentId, 'html'); });
    row.appendChild(go);
    row.appendChild(html);
    body.appendChild(row);
  });
}

/** Column layout + @page rules shared by the app print view and exported HTML. */
function columnCss(cols) {
  const gap = cols >= 4 ? '16px' : (cols === 3 ? '22px' : '28px');
  return {
    screen: cols > 1
      ? '.doc{column-count:' + cols + ';column-gap:' + gap + ';column-rule:1px solid #c3cbd6;' +
        'text-align:justify;-webkit-hyphens:auto;hyphens:auto;max-width:1400px;font-size:' +
        (cols >= 4 ? 14 : (cols === 3 ? 15 : 16)) + 'px}'
      : '.doc{max-width:820px;font-size:16px}',
    print: cols > 1
      ? '.doc{column-count:' + cols + ';column-gap:' + gap + ';column-rule:1px solid #999;' +
        'text-align:justify;max-width:none}'
      : '.doc{max-width:none}'
  };
}

/** Builds the <style> body for an exported file: screen look + exact print layout. */
function exportStyleSheet(cols, basePt) {
  const p = paperDef();
  const pt = Math.round(basePt * p.scale * 100) / 100;
  const margin = paperMarginIn();
  const c = columnCss(cols);
  return EXPORT_CSS.concat([
    c.screen,
    '.doc{font-size:' + (cols >= 4 ? 14 : (cols === 3 ? 15 : 16)) + 'px}',
    '@media(max-width:700px){.doc{column-count:1;column-rule:0;text-align:left;font-size:16px}}',
    '@page{' + (p.css ? 'size:' + p.css + ';' : '') + 'margin:' + margin + 'in}',
    '@media print{',
    '  html,body{background:#fff!important}',
    '  body{padding:0;margin:0}',
    '  .doc{font-size:' + pt + 'pt}',
    '  ' + c.print,
    '  h1,h2,h3,h4,h5,h6{break-after:avoid;page-break-after:avoid;line-height:1.25}',
    '  p{orphans:2;widows:2}',
    '  img,pre,table,blockquote,.callout,.math-block,.diagram,.task-item{break-inside:avoid;page-break-inside:avoid}',
    '  .table-wrap{overflow:visible}',
    '  table{font-size:.84em}',
    '  th,td{padding:5px 6px}',
    '  td{overflow-wrap:anywhere}',
    '  thead th{overflow-wrap:normal;hyphens:auto;white-space:normal}',
    '  .diagram svg,.svg-block svg{max-width:100%;height:auto}',
    '  .callout,mark{-webkit-print-color-adjust:exact;print-color-adjust:exact}',
    '  a{color:#111;text-decoration:underline}',
    '}'
  ]).join('\n');
}

function standaloneHtml(title, inner, opts) {
  const o = opts || {};
  const cols = clamp(Number(o.cols) || 1, 1, 4);
  const basePt = Number(o.size) || 11;
  return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
    '<meta name="viewport" content="width=device-width,initial-scale=1">\n' +
    '<meta name="generator" content="Notes Studio 1.0">\n' +
    '<title>' + escapeHtml(title) + '</title>\n' +
    '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">\n' +
    '<style>\n' + exportStyleSheet(cols, basePt) + '\n</style>\n</head>\n<body>\n<article class="doc">\n' +
    (o.titleText ? '<h1 class="doc-title">' + escapeHtml(o.titleText) + '</h1>\n' : '') +
    inner + '\n</article>\n</body>\n</html>';
}

function safeFileName(s) {
  return String(s || 'note').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 60) || 'note';
}

function downloadFile(name, content, mime) {
  try {
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1200);
    toast('Downloaded ' + name);
  } catch (e) {
    toast('Download failed');
  }
}

function noteAsMarkdown(n) {
  const content = n.content || '';
  const first = content.trimStart();
  if (/^#{1,6}\s/.test(first)) return content;
  return '# ' + (n.title || 'Untitled note') + '\n\n' + content;
}

function plainTextFrom(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  $$('.code-copy, .diagram-err, .code-head', d).forEach((n) => n.remove());
  d.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,tr,div').forEach((n) => { n.append('\n'); });
  return (d.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}

async function htmlForNote(n) {
  const holder = document.createElement('div');
  holder.className = 'reader-inner';
  holder.style.cssText = 'position:fixed;left:-10000px;top:0;width:780px;visibility:hidden';
  document.body.appendChild(holder);
  const saved = S.content;
  try {
    S.content = n.content || '';
    S.mathCount = 0;
    holder.innerHTML = buildHtml(n.content || '');
    enhance(holder);
    await renderDiagrams(holder, null);
    return holder.innerHTML;
  } catch (e) {
    return '<p>' + escapeHtml(snippetOf(n.content)) + '</p>';
  } finally {
    S.content = saved;
    holder.remove();
  }
}

async function exportNote(id, fmt) {
  const n = S.notes[id] || (S.currentId ? S.notes[S.currentId] : null);
  if (!n) { toast('Save the note first'); return; }
  const base = safeFileName(n.title);
  if (fmt === 'md') {
    downloadFile(base + '.md', noteAsMarkdown(n), 'text/markdown;charset=utf-8');
    return;
  }
  if (fmt === 'share') {
    const text = snippetOf(n.content).slice(0, 900);
    if (navigator.share) navigator.share({ title: n.title, text: text }).catch(() => {});
    else copyText(text).then(() => toast('Share not supported — copied instead')).catch(() => toast('Could not copy'));
    return;
  }
  const html = await htmlForNote(n);
  if (fmt === 'txt') downloadFile(base + '.txt', plainTextFrom(html) || snippetOf(n.content), 'text/plain;charset=utf-8');
  else if (fmt === 'html') {
    const hasH1 = /^\s*<h1[\s>]/i.test(html);
    downloadFile(base + '.html', standaloneHtml(n.title, html, {
      cols: S.settings.printCols,
      size: S.settings.printSize,
      titleText: (S.settings.printTitle && !hasH1) ? n.title : ''
    }), 'text/html;charset=utf-8');
  }
  else if (fmt === 'copy') copyText(plainTextFrom(html) || snippetOf(n.content)).then(() => toast('Copied to clipboard')).catch(() => toast('Could not copy'));
}

function exportBackup() {
  const payload = {
    app: 'Notes Studio',
    version: '1.0',
    exportedAt: new Date().toISOString(),
    notes: Object.values(S.notes),
    recycle: S.recycle,
    settings: S.settings
  };
  const name = 'notes-studio-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  downloadFile(name, JSON.stringify(payload, null, 2), 'application/json');
}

function mergeImportedNotes(list) {
  let added = 0;
  let updated = 0;
  list.forEach((raw) => {
    const n = sanitizeNote(raw, uid());
    if (!n || (!n.content && !n.title)) return;
    if (S.notes[n.id]) {
      S.notes[n.id] = Object.assign({}, S.notes[n.id], {
        title: n.title || S.notes[n.id].title,
        content: n.content,
        updatedAt: Math.max(S.notes[n.id].updatedAt, n.updatedAt),
        tags: deriveTags(n.content)
      });
      updated++;
    } else {
      S.notes[n.id] = n;
      added++;
    }
  });
  if (added || updated) persistNotes();
  return { added: added, updated: updated };
}

function handleImportFile(file) {
  if (!file) return;
  if (file.size > 6 * 1024 * 1024) { toast('File too large (max 6 MB)'); return; }
  const name = file.name || '';
  const reader = new FileReader();
  reader.onerror = () => toast('Could not read the file');
  reader.onload = (e) => {
    const text = String(e.target.result || '');
    try {
      if (/\.json$/i.test(name) || /^\s*[{[]/.test(text)) {
        const data = JSON.parse(text);
        let list = [];
        if (Array.isArray(data)) list = data;
        else if (data && Array.isArray(data.notes)) list = data.notes;
        else if (data && data.notes && typeof data.notes === 'object') list = Object.values(data.notes);
        else if (data && typeof data === 'object' && !data.app) list = Object.keys(data).map((k) => data[k]).filter((x) => x && typeof x === 'object');
        if (!list.length) { toast('No notes found in this file'); return; }
        const res = mergeImportedNotes(list);
        renderHome();
        toast('Imported ' + res.added + ' new, updated ' + res.updated);
        return;
      }
      let content = text;
      if (/\.svg$/i.test(name)) content = '```svg\n' + text.trim() + '\n```';
      const note = sanitizeNote({ id: uid(), title: deriveTitle(content, true), content: content, createdAt: Date.now(), updatedAt: Date.now() });
      S.notes[note.id] = note;
      persistNotes();
      renderHome();
      openEditor(note.id);
      toast('Imported “' + note.title + '”');
    } catch (err) {
      toast('Import failed — file not recognised');
    }
  };
  reader.readAsText(file);
}

          closeEditorUI();
        }
      }));
    }
    body.appendChild(list);
  });
}

/* =====================================================================
   GLOBAL EVENTS
   ===================================================================== */

function bindStaticEvents() {
  on($('#btnTheme'), 'click', toggleTheme);
  on($('#btnDrawer'), 'click', openDrawer);
  on($('#btnMore'), 'click', openEditorMenu);
  on($('#btnBack'), 'click', () => closeEditorUI());
  on($('#btnSave'), 'click', () => {
    S.title = $('#titleInput').value;
    const n = commitNote();
    if (n) renderHome();
  });
  on($('#btnPrintTop'), 'click', openPrintOptions);
  on($('#sheetClose'), 'click', () => sheet.close());
  on($('#sheetBackdrop'), 'click', () => sheet.close());
  on($('#fabNew'), 'click', () => newNote());

  $$('.segmented button').forEach((b) => {
    b.addEventListener('click', () => setMode(b.dataset.mode));
  });
  $$('#colSeg button').forEach((b) => {
    b.addEventListener('click', () => {
      S.cols = Number(b.dataset.cols) || 1;
      S.settings.cols = S.cols;
      saveSettings();
      applyReaderSettings();
    });
  });
  on($('#fsUp'), 'click', () => {
    S.fontSize = clamp(S.fontSize + 1, 13, 26);
    S.settings.fontSize = S.fontSize;
    saveSettings();
    applyReaderSettings();
  });
  on($('#fsDown'), 'click', () => {
    S.fontSize = clamp(S.fontSize - 1, 13, 26);
    S.settings.fontSize = S.fontSize;
    saveSettings();
    applyReaderSettings();
  });

  on($('#toolbar'), 'click', (e) => {
    const b = e.target.closest('[data-md]');
    if (!b) return;
    mdAction(b.dataset.md);
  });

  const ed = $('#editor');
  on(ed, 'input', () => {
    S.content = ed.value;
    handleInput();
  });
  on(ed, 'keydown', (e) => {
    // Tab indents instead of leaving the textarea
    if (e.key === 'Tab' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
      e.preventDefault();
      const start = ed.selectionStart;
      const end = ed.selectionEnd;
      if (start !== end) {
        prefixLines('  ');
      } else {
        replaceRange(ed, start, end, '  ', start + 2);
      }
    }
  });
  on(ed, 'paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf('image/') === 0) {
        const file = items[i].getAsFile();
        if (!file) continue;
        e.preventDefault();
        if (file.size > 700 * 1024) { toast('Image too large (max 700 KB) — use a URL instead'); return; }
        const fr = new FileReader();
        fr.onload = () => {
          insertBlock('![' + (file.name || 'image') + '](' + fr.result + ')');
        };
        fr.readAsDataURL(file);
        return;
      }
    }
  });

  on($('#titleInput'), 'input', () => {
    S.title = $('#titleInput').value;
    S.dirty = true;
    updateSaveState(false);
    clearTimeout(S.draftTimer);
    S.draftTimer = setTimeout(saveDraft, 800);
    if (S.settings.autosave && S.currentId) {
      clearTimeout(S.saveTimer);
      S.saveTimer = setTimeout(() => { if (S.dirty) commitNote({ silent: true }); }, 1600);
    }
  });

  // home grid
  const grid = $('#notesGrid');
  on(grid, 'click', (e) => {
    const pin = e.target.closest('[data-act="pin"]');
    if (pin) {
      e.stopPropagation();
      const card = pin.closest('.note-card');
      togglePin(Number(card.dataset.id));
      return;
    }
    const more = e.target.closest('[data-act="more"]');
    if (more) {
      e.stopPropagation();
      const card = more.closest('.note-card');
      openNoteMenu(Number(card.dataset.id));
      return;
    }
    const card = e.target.closest('.note-card');
    if (card) openNote(Number(card.dataset.id));
  });
  on(grid, 'keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.note-card');
    if (!card) return;
    e.preventDefault();
    openNote(Number(card.dataset.id));
  });
  on($('#emptyState'), 'click', (e) => {
    const b = e.target.closest('[data-empty]');
    if (!b) return;
    const act = b.dataset.empty;
    if (act === 'new') newNote();
    if (act === 'template') openTemplates();
    if (act === 'clear') { S.query = ''; $('#searchInput').value = ''; renderHome(); }
  });

  const search = $('#searchInput');
  const doSearch = debounce(() => { S.query = search.value; renderHome(); }, 110);
  on(search, 'input', doSearch);
  on($('#searchClear'), 'click', () => {
    search.value = '';
    S.query = '';
    renderHome();
    search.focus();
  });
  on($('#filterChips'), 'click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    S.activeTag = chip.dataset.tag || 'all';
    renderHome();
  });

  on($('#importFile'), 'change', (e) => {
    const f = e.target.files && e.target.files[0];
    if (f) handleImportFile(f);
    e.target.value = '';
  });

  // keyboard shortcuts
  window.addEventListener('keydown', (e) => {
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') {
      if (S.sheetOpen) { sheet.close(); return; }
      if (S.view === 'editor') { closeEditorUI(); return; }
      return;
    }
    if (!mod) return;
    const k = e.key.toLowerCase();
    if (k === 's') { e.preventDefault(); if (S.view === 'editor') { S.title = $('#titleInput').value; commitNote(); renderHome(); } else { exportBackup(); } }
    else if (k === 'p') { e.preventDefault(); if (S.view === 'editor') openPrintOptions(); }
    else if (k === 'enter') { e.preventDefault(); if (S.view === 'editor') setMode(S.mode === 'read' ? 'edit' : 'read'); }
    else if (k === 'k') { e.preventDefault(); if (S.view === 'editor') closeEditorUI(); setTimeout(() => $('#searchInput').focus(), 320); }
    else if (k === 'b' && document.activeElement === $('#editor')) { e.preventDefault(); mdAction('bold'); }
    else if (k === 'i' && document.activeElement === $('#editor')) { e.preventDefault(); mdAction('italic'); }
  });

  // warn before leaving with unsaved work when autosave is off
  window.addEventListener('beforeunload', (e) => {
    if (S.view === 'editor' && S.dirty && !S.settings.autosave) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (S.settings.theme === 'system') applyTheme();
  });
}

/* =====================================================================
   PWA — install, update, offline status, share target, shortcuts
   ===================================================================== */
const PWA = {
  deferredPrompt: null,
  installed: false,
  reg: null,
  waiting: null,

  supported() {
    return 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');
  },

  isStandalone() {
    return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      window.navigator.standalone === true ||
      document.referrer.indexOf('android-app://') === 0;
  },

  async init() {
    PWA.installed = PWA.isStandalone();

    if (PWA.installed) { PWA.setMenuInstall(false, 'Already installed'); return; }

    if (!PWA.supported()) {
      PWA.setMenuInstall(true, 'Open over HTTPS to install');
      return;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      PWA.deferredPrompt = e;
      PWA.setMenuInstall(true, 'Add Notes Studio to your home screen');
    });

    window.addEventListener('appinstalled', () => {
      PWA.deferredPrompt = null;
      PWA.installed = true;
      PWA.setMenuInstall(false, 'Installed ✓');
      toast('Notes Studio installed', { duration: 3200 });
    });

    window.addEventListener('online', () => PWA.updateStatus(true));
    window.addEventListener('offline', () => PWA.updateStatus(false));

    try {
      PWA.reg = await navigator.serviceWorker.register('sw.js', { scope: './' });
      PWA.watchUpdates(PWA.reg);
    } catch (err) {
      console.warn('Service worker registration failed:', err && err.message);
      PWA.setMenuInstall(false, 'Service worker unavailable');
    }
  },

  watchUpdates(reg) {
    const offer = (worker) => {
      if (!worker) return;
      PWA.waiting = worker;
      toast('New version ready', {
        duration: 12000,
        action: { label: 'Reload', fn: () => { worker.postMessage({ type: 'SKIP_WAITING' }); } }
      });
    };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      if (!nw) return;
      nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) offer(nw);
      });
    });
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (reloading) return;
      reloading = true;
      location.reload();
    });
    // check for a new worker when the app comes back to the foreground
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && reg) reg.update().catch(() => {});
    });
  },

  setMenuInstall(show, sub) {
    const btn = document.getElementById('menuInstall');
    if (!btn) return;
    btn.hidden = !show;
    if (sub) {
      const s = btn.querySelector('.it-sub');
      if (s) s.textContent = sub;
    }
  },

  updateStatus() {
    if (!navigator.onLine) {
      toast('Offline — your notes still work', { duration: 2600 });
    }
  }
};

async function promptInstall() {
  if (PWA.installed) { toast('Already installed'); return; }
  const prompt = PWA.deferredPrompt;
  if (!prompt) {
    const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
    sheet.open('Install Notes Studio', (body) => {
      const p1 = el('p', 'sheet-note', ios
        ? 'On iPhone / iPad: tap the Share button, then “Add to Home Screen”.'
        : 'Open the browser menu (⋮) and choose “Install app” or “Add to Home screen”.');
      p1.style.fontSize = '.9rem';
      body.appendChild(p1);
      const list = el('ul');
      list.style.cssText = 'font-size:.86rem;line-height:1.7;opacity:.85;padding-left:20px;margin:0 0 16px';
      ['Opens full screen, no browser bars', 'Works fully offline', 'Your own icon on the home screen', 'Notes stay on this device'].forEach((t) => {
        const li = el('li', null, t); list.appendChild(li);
      });
      body.appendChild(list);
      const btn = el('button', 'btn btn-primary btn-block', 'Got it');
      btn.type = 'button';
      btn.addEventListener('click', () => sheet.close());
      body.appendChild(btn);
    });
    return;
  }
  prompt.prompt();
  try {
    const res = await prompt.userChoice;
    if (res && res.outcome === 'accepted') toast('Installing…');
    else toast('Install cancelled');
  } catch (e) {}
  PWA.deferredPrompt = null;
  PWA.setMenuInstall(false);
}

/** Handle manifest shortcuts (?action=new|templates|last) and share_target / file_handlers. */
async function handleLaunchAction() {
  let params;
  try { params = new URLSearchParams(location.search); } catch (e) { params = new URLSearchParams(''); }
  const action = params.get('action');

  // shared from another app (share_target)
  const shared = ['title', 'text', 'url'].map((k) => params.get(k)).filter(Boolean).join('\n').trim();
  if (shared) {
    const content = params.get('text') || params.get('url') || params.get('title') || '';
    const note = sanitizeNote({ id: uid(), title: deriveTitle(content, true), content: content, createdAt: Date.now(), updatedAt: Date.now() });
    S.notes[note.id] = note;
    persistNotes();
    renderHome();
    openEditor(note.id);
    history.replaceState(history.state, '', location.pathname);
    toast('Shared text saved as a note');
    return true;
  }

  if (action === 'new') {
    newNote();
    history.replaceState(history.state, '', location.pathname);
    return true;
  }
  if (action === 'templates') {
    openTemplates();
    history.replaceState(history.state, '', location.pathname);
    return true;
  }
  if (action === 'last') {
    const list = sortedNotes();
    if (list.length) openNote(list[0].id);
    history.replaceState(history.state, '', location.pathname);
    return true;
  }

  // launched by opening a file with the installed app (file_handlers)
  if (window.launchQueue && typeof window.launchQueue.setConsumer === 'function') {
    try {
      window.launchQueue.setConsumer(async (launchParams) => {
        const file = launchParams && launchParams.files && launchParams.files[0];
        if (!file) return;
        try {
          const f = await file.getFile();
          handleImportFile(f);
        } catch (e) { toast('Could not read the opened file'); }
      });
    } catch (e) {}
  }
  return false;
}

function seedFirstRun() {
  if (Object.keys(S.notes).length || LS.raw(K.lastOpen, '') === 'seeded') return;
  const note = sanitizeNote({
    id: uid(),
    title: 'Welcome to Notes Studio',
    content: welcomeContent(),
    createdAt: Date.now(),
    updatedAt: Date.now()
  });
  S.notes[note.id] = note;
  persistNotes();
  LS.rawSet(K.lastOpen, 'seeded');
}

function init() {
  nav.init();
  S.markedOk = !!(window.marked && typeof window.marked.parse === 'function');
  S.katexOk = !!(window.katex && typeof window.katex.renderToString === 'function');
  S.mermaidOk = !!(window.mermaid && typeof window.mermaid.render === 'function');

  if (S.mermaidOk && window.mermaid.initialize) {
    try {
      window.mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        theme: 'neutral',
        fontFamily: 'Roboto, -apple-system, Segoe UI, sans-serif',
        flowchart: { htmlLabels: true, useMaxWidth: true },
        sequence: { useMaxWidth: true },
        themeVariables: { fontSize: '15px' }
      });
    } catch (e) {}
  }
  hookPurify();
  loadStore();
  seedFirstRun();

  if (!PAPER_DEFS[S.settings.printPaper]) S.settings.printPaper = 'a3';
  if (typeof S.settings.printMargin !== 'number' || !isFinite(S.settings.printMargin)) S.settings.printMargin = 0.5;
  S.fontSize = clamp(Number(S.settings.fontSize) || 17, 13, 26);
  S.split = clamp(Number(S.settings.split) || 50, 22, 82);
  S.cols = clamp(Number(S.settings.cols) || 1, 1, 4);

  applyTheme();
  bindStaticEvents();
  bindPreviewDelegates($('#preview'));
  initResizer();
  renderHome();
  applyReaderSettings();
  setPrintPageStyle();

  PWA.init();
  handleLaunchAction();

  if (!S.markedOk) {
    setTimeout(() => toast('Markdown library not loaded — using offline renderer. Math uses Lite mode.', { duration: 5200 }), 900);
  }

  window.addEventListener('error', (e) => {
    if (e && e.message && /Script error/i.test(e.message)) return;
    console.warn('Notes Studio error:', e.message);
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
